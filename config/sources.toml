type = "link_scan"
group = "aggregator"
url = "https://www.europeanjobmarketofeconomists.org/job-listings"
link_pattern = 'europeanjobmarketofeconomists\.org/job-listing/'
pagination_param = "page"
pagination_zero_based = true
max_pages = 12
skip_unresolved_link_templates = true
institution_from_context = true
field_implied = true
note = "EJME is an EconJobMarket mirror. Upstream currently publishes placeholder [nid] URLs; skip unusable links and retry on later runs. EconJobMarket is independently collected."

[[board]]
name = "academics_de"
type = "link_scan"
group = "aggregator"
urls = [
  "https://www.academics.de/stellenanzeigen/branche-wirtschaft-management-verwaltung/Nw==",
  "https://www.academics.de/stellenanzeigen/position-wissenschaftlicher-mitarbeiter/VQ==",
]
link_pattern = 'academics\.de/jobs/'
max_pages = 1
institution_from_context = true
note = "Academics.de - DACH clearinghouse for academic positions (Germany, Austria, Switzerland)."

[[board]]
name = "academics_com"
type = "link_scan"
group = "aggregator"
url = "https://www.academics.com/jobsearch/field-subject-economics-management-business-administration/Nw=="
link_pattern = 'academics\.com/jobs/'
max_pages = 1
institution_from_context = true
note = "Academics.com - English portal for DACH predoctoral and research assistant positions."

[[board]]
name = "somma"
type = "link_scan"
group = "aggregator"
url = "https://somma.es/jobs/"
# Restrict structured selection to a real vacancy slug, never the /job/ root.
link_pattern = '^https://somma\.es/job/[a-z0-9][a-z0-9-]*/?$'
# The official SOMMa table stores job titles and metadata in separate cells.
selectors = { item = "tbody tr", title = "td.title", link = "td.actions a[href^='https://somma.es/job/']:not([href='https://somma.es/job/']), td.actions a[href^='/job/']:not([href='/job/'])", institution = "td.institution", location = "td.province", deadline = "td.deadline" }
country = "Spain"
note = "Spanish centres of excellence including CEMFI; read vacancy titles, links, and metadata from official jobs table."

[[board]]
name = "jobs_ac_uk"
type = "link_scan"
group = "aggregator"
urls = ["https://www.jobs.ac.uk/search/?keywords=predoctoral&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=pre-doctoral&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+assistant+economics&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+assistant+finance&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+officer+economics&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=predoc&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=research+assistant+business+school&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=research+assistant+political+science&pageSize=50"]
link_pattern = 'jobs\.ac\.uk/job/[A-Z0-9]+/'
institution_from_context = true

[[board]]
name = "euraxess"
type = "link_scan"
group = "aggregator"
urls = ["https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Apredoctoral", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Apre-doctoral", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Aresearch%20assistant%20economics", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_country%3A788&f%5B1%5D=keywords%3Abarcelona%20school%20of%20economics"]
link_pattern = 'euraxess\.ec\.europa\.eu/jobs/\d+$'
institution_from_context = true

[[board]]
name = "academictransfer"
type = "link_scan"
enabled = true
group = "aggregator"
urls = ["https://www.academictransfer.com/en/jobs/?q=research+assistant+economics", "https://www.academictransfer.com/en/jobs/?q=predoc"]
# Live job cards use empty full-card <a> overlays with titles and employers in siblings.
selectors = { item = "article", title = "h3", link = "a[href*='/en/jobs/']", institution = "div[class*='md:col-start-8'] span.text-at-small.text-gray-700", location = "span.text-at-small.flex.items-center.gap-1.text-gray-500" }
# This multi-employer portal is not limited to Dutch employers; do not infer country.
note = "AcademicTransfer research openings, including economics and predoctoral search results; selector mode handles empty overlay anchors."

[[board]]
name = "jobbnorge"
type = "link_scan"
enabled = false
group = "aggregator"
urls = ["https://www.jobbnorge.no/en/available-jobs?search=research+assistant+economics"]
link_pattern = 'jobbnorge\.no/(en/)?available-jobs/job/\d+'
institution_from_context = true
country = "Norway"
note = "OFF: search address no longer exists (HTTP 404); Norwegian jobs arrive via EURAXESS."

