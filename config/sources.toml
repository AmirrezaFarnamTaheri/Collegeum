link_pattern = 'academics\.com/jobs/'
max_pages = 1
institution_from_context = true
note = "Academics.com - English portal for DACH predoctoral and research assistant positions."

[[board]]
name = "somma"
type = "link_scan"
group = "aggregator"
url = "https://somma.es/jobs/"
# Restrict structured selection to a real vacancy slug, never the /job/ root.
link_pattern = '^https://somma\.es/job/[a-z0-9][a-z0-9-]*/?$'
# The official SOMMa table stores job titles and metadata in separate cells.
selectors = { item = "tbody tr", title = "td.title", link = "td.actions a[href^='https://somma.es/job/']:not([href='https://somma.es/job/']), td.actions a[href^='/job/']:not([href='/job/'])", institution = "td.institution", location = "td.province", deadline = "td.deadline" }
country = "Spain"
note = "Spanish centres of excellence including CEMFI; read vacancy titles, links, and metadata from official jobs table."

[[board]]
name = "jobs_ac_uk"
type = "link_scan"
group = "aggregator"
urls = ["https://www.jobs.ac.uk/search/?keywords=predoctoral&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=pre-doctoral&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+assistant+economics&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+assistant+finance&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+officer+economics&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=predoc&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=research+assistant+business+school&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=research+assistant+political+science&pageSize=50"]
link_pattern = 'jobs\.ac\.uk/job/[A-Z0-9]+/'
