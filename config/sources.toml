# Source registry for predoc-pipeline.
#
# Three kinds of source:
#
#   [[board]]  -> job boards and university career sites, read by the `boards`
#                 collector (ported from predoc-bot). These are the sources that
#                 actually find econ/business predocs today, so they are ON by
#                 default. Types: predoc_org | rss | link_scan | varbi | workday | linkedin
#                 link_scan keeps every link whose URL matches `link_pattern` and reads
#                 the card around it. Set `enabled = false` to switch one off.
#   [[feed]]   -> RSS/Atom feeds, read by the `feeds` collector (feedparser).
#   [[portal]] -> HTML pages carrying Schema.org JobPosting metadata, read by the
#                 `portals` collector.
#
# Run `predoc-pipeline sources verify` after editing this file.
#
# J-PAL and IPA were removed on purpose: they are US-based organisations and the
# owner of this bot does not want their positions (see config/preferences.toml,
# `excluded_employers`, which blocks J-PAL whatever source it arrives from).

# ===========================================================================
# Job boards (ON)
# ===========================================================================

# --- aggregator ------------------------------------------------------------

[[board]]
name = "predoc_org"
type = "predoc_org"
group = "aggregator"
url = "https://predoc.org/opportunities"
note = "Mostly US; also lists psychology/medicine posts -> region and field are checked per post."

[[board]]
name = "inomics"
type = "rss"
group = "aggregator"
url = "https://inomics.com/rss"
include_url_contains = ["/job/"]
field_implied = true

[[board]]
name = "economic_misfit"
type = "rss"
group = "aggregator"
urls = ["https://theeconomicmisfit.com/category/pre-docs/feed/", "https://theeconomicmisfit.com/feed/"]
title_format = "role_at_institution"
categories_exclude = ["post-doc", "workshop", "scholarship", "conference", "summer school", "seminar"]

[[board]]
name = "applied_econ_jobs"
type = "rss"
enabled = false
group = "aggregator"
url = "https://appliedeconjobs.substack.com/feed"
title_format = "role_at_institution"
field_implied = true
note = "OFF: Substack blocks GitHub servers (HTTP 403)."

[[board]]
name = "econjobmarket"
type = "link_scan"
group = "aggregator"
urls = ["https://econjobmarket.org/market", "https://econjobmarket.org/positions"]
link_pattern = 'econjobmarket\.org/positions/\d+$'
institution_from_context = true
field_implied = true

[[board]]
name = "european_job_market"
type = "link_scan"
group = "aggregator"
urls = ["https://www.europeanjobmarketofeconomists.org/job-listings", "https://www.europeanjobmarketofeconomists.org/job-listings?page=1", "https://www.europeanjobmarketofeconomists.org/job-listings?page=2"]
link_pattern = 'europeanjobmarketofeconomists\.org/job-listing/'
institution_from_context = true
field_implied = true

[[board]]
name = "somma"
type = "link_scan"
group = "aggregator"
url = "https://somma.es/jobs/"
link_pattern = 'somma\.es/job/[^/]+/?$'
institution_from_context = true
country = "Spain"
note = "Spanish centres of excellence (CEMFI, BSE, CREI...) - all sciences, so fields are checked."

[[board]]
name = "jobs_ac_uk"
type = "link_scan"
group = "aggregator"
urls = ["https://www.jobs.ac.uk/search/?keywords=predoctoral&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=pre-doctoral&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+assistant+economics&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+assistant+finance&pageSize=100", "https://www.jobs.ac.uk/search/?keywords=research+officer+economics&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=predoc&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=research+assistant+business+school&pageSize=50", "https://www.jobs.ac.uk/search/?keywords=research+assistant+political+science&pageSize=50"]
link_pattern = 'jobs\.ac\.uk/job/[A-Z0-9]+/'
institution_from_context = true

[[board]]
name = "euraxess"
type = "link_scan"
group = "aggregator"
urls = ["https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Apredoctoral", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Apre-doctoral", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Aresearch%20assistant%20economics", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_country%3A788&f%5B1%5D=keywords%3Abarcelona%20school%20of%20economics"]
link_pattern = 'euraxess\.ec\.europa\.eu/jobs/\d+$'
institution_from_context = true

[[board]]
name = "academictransfer"
type = "link_scan"
enabled = false
group = "aggregator"
urls = ["https://www.academictransfer.com/en/jobs/?q=research+assistant+economics", "https://www.academictransfer.com/en/jobs/?q=predoc"]
link_pattern = 'academictransfer\.com/en/(jobs/)?\d+/'
institution_from_context = true
country = "Netherlands"
note = "OFF: page is built by JavaScript (always 0 jobs); Dutch jobs arrive via EURAXESS."

[[board]]
name = "jobbnorge"
type = "link_scan"
enabled = false
group = "aggregator"
urls = ["https://www.jobbnorge.no/en/available-jobs?search=research+assistant+economics"]
link_pattern = 'jobbnorge\.no/(en/)?available-jobs/job/\d+'
institution_from_context = true
country = "Norway"
note = "OFF: search address no longer exists (HTTP 404); Norwegian jobs arrive via EURAXESS."

[[board]]
name = "academic_positions"
type = "link_scan"
enabled = false
group = "aggregator"
urls = ["https://academicpositions.com/find-jobs?positions[0]=research-assistant&fields[0]=economics", "https://academicpositions.com/find-jobs?positions[0]=research-assistant&fields[0]=finance"]
render = true
link_pattern = 'academicpositions\.com/ad/'
institution_from_context = true
note = "OFF: JavaScript-rendered; needs Playwright."


# --- university ------------------------------------------------------------

