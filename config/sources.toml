# --- social ------------------------------------------------------------

[[board]]
name = "linkedin"
type = "linkedin"
group = "social"
min_interval = 4
employer_required = true
keywords = ["predoc economics", "pre-doctoral economics", "predoctoral", "pre-doctoral fellow", "research assistant economics university", "research assistant business school"]
locations = ["European Union", "United Kingdom", "Canada", "Switzerland", "Norway"]
f_TPR = "r604800"
max_pages = 1
backend = "guest"
note = "LinkedIn always names the employer, so it must be academic (employer_required)."

# ===========================================================================
# Feeds (templates, OFF)
# ===========================================================================

[[feed]]
name = "nber-jobs"
url = "https://www.nber.org/RePEc/CGI-Bin/AutoRSS/entries.rss"
country = "International"
enabled = false
verified = false
note = "Placeholder. NBER's job-market RSS moves between paths across site redesigns; confirm the current feed path before enabling."
tags = ["economics"]

[[feed]]
name = "example-university-jobs"
url = "https://jobs.example.ac.uk/rss/rss.aspx?cat=607"
country = "United Kingdom"
enabled = false
verified = false
note = "Template for the common per-institution RSS pattern: /rss/rss.aspx?cat=<category-id>. Replace with a real institution and category id, then verify."
tags = ["template"]

# ===========================================================================
# Portals (templates, OFF). INOMICS, EconJobMarket and EURAXESS are read by
# the [[board]] entries above instead.
# ===========================================================================

[[portal]]
name = "example-econ-department"
url = "https://econ.example.org/jobs/"
country = "International"
enabled = false
verified = false
follow_links = true
link_pattern = "/jobs/[0-9]+/?$"
note = "Template portal entry. Point at a real department listings page, set link_pattern to match that site's detail-page URLs, then run predoc-pipeline sources verify."
tags = ["template"]
