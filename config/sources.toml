type = "rss"
group = "aggregator"
urls = ["https://theeconomicmisfit.com/category/pre-docs/feed/", "https://theeconomicmisfit.com/feed/"]
title_format = "role_at_institution"
categories_exclude = ["post-doc", "workshop", "scholarship", "conference", "summer school", "seminar"]

[[board]]
