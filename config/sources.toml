# Source registry for predoc-pipeline.
#
# Three kinds of source:
#
#   [[board]]  -> job boards and university career sites, read by the `boards`
#                 collector (ported from predoc-bot). These are the sources that
#                 actually find econ/business predocs today, so they are ON by
#                 default. Types: predoc_org | rss | link_scan | varbi | workday | linkedin
#                 link_scan keeps every link whose URL matches `link_pattern` and reads
#                 the card around it. Set `enabled = false` to switch one off.
#   [[feed]]   -> RSS/Atom feeds, read by the `feeds` collector (feedparser).
#   [[portal]] -> HTML pages carrying Schema.org JobPosting metadata, read by the
#                 `portals` collector.
#
# Run `predoc-pipeline sources verify` after editing this file.
#
# J-PAL and IPA were removed on purpose: they are US-based organisations and the
# owner of this bot does not want their positions (see config/preferences.toml,
# `excluded_employers`, which blocks J-PAL whatever source it arrives from).

# ===========================================================================
# Job boards (ON)
# ===========================================================================

# --- aggregator ------------------------------------------------------------

[[board]]
name = "predoc_org"
type = "predoc_org"
group = "aggregator"
url = "https://predoc.org/opportunities"
note = "Mostly US; also lists psychology/medicine posts -> region and field are checked per post."

