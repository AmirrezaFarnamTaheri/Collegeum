type = "link_scan"
group = "aggregator"
urls = ["https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Apredoctoral", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Apre-doctoral", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Aresearch%20assistant%20economics", "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=job_country%3A788&f%5B1%5D=keywords%3Abarcelona%20school%20of%20economics"]
link_pattern = 'euraxess\.ec\.europa\.eu/jobs/\d+$'
