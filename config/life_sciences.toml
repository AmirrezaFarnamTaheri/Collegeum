# Independent Life Sciences PhD sourcing for private Telegram subscribers.
# These boards are NEVER passed through the economics publication pipeline.
# Sources are only contacted if somebody opts in to "life_sciences_phd".
# Each run checks at most 12 enabled sources (with oldest-first rotation when
# more are enabled), up to 60 rows each and 200 rows per run.
#
# All matching additionally requires an explicit doctoral role, an eligible
# biological research field and a concrete continental-European country.
# Unknown location, UK/US/Canada, postdoc and explicitly self-funded adverts
# are excluded. Salaries, fee waivers and full funding are NOT assumed.

[[board]]
name = "life_euraxess"
type = "link_scan"
group = "life_sciences"
enabled = true
urls = [
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Aepigenetics",
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Achromatin",
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Aneurodevelopment",
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Agenomics",
]
link_pattern = 'euraxess\.ec\.europa\.eu/jobs/\d+$'
institution_from_context = true
note = "EU careers; individual job cards must establish a European country."

[[board]]
name = "life_academictransfer"
type = "link_scan"
group = "life_sciences"
enabled = true
urls = [
  "https://www.academictransfer.com/en/jobs/?q=epigenetics",
  "https://www.academictransfer.com/en/jobs/?q=genomics",
  "https://www.academictransfer.com/en/jobs/?q=neuroscience",
]
link_pattern = 'academictransfer\.com/en/(jobs/)?\d+/'
selectors = { item = "article", title = "h3", link = "a[href*='/en/jobs/']", institution = "div[class*='md:col-start-8'] span.text-at-small.text-gray-700", location = "span.text-at-small.flex.items-center.gap-1.text-gray-500" }
institution_from_context = true
note = "Official multi-country aggregator: use job-card workplace and deny unknown locations."

[[board]]
name = "life_max_planck"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://www.mpg.de/jobboard"
link_pattern = 'mpg\.de/\d{7,9}/[^/?#]+'
institution = "Max Planck Society"
note = "Official Max Planck jobboard replaces retired RSS; require explicitly proven European location and biological field."

# Official pages and actual vacancy href formats checked 2026-10-11.
# Site structure and consent/robots behavior still need ongoing live checks.
[[board]]
name = "life_uppsala"
type = "link_scan"
group = "life_sciences"
enabled = true
urls = [
  "https://www.uu.se/en/about-uu/join-us/jobs-and-vacancies?varbiCategory=PhD+positions",
  "https://www.uu.se/en/about-uu/join-us/jobs-and-vacancies?varbiCategory=PhD+positions&start=10",
  "https://www.uu.se/en/about-uu/join-us/jobs-and-vacancies?varbiCategory=PhD+positions&start=20",
]
link_pattern = 'uu\.se/en/about-uu/join-us/jobs-and-vacancies/job-details\?query=\d+'
institution = "Uppsala University"
country = "Sweden"
min_interval = 3.0
note = "Official doctoral listings; detail URLs use /job-details?query=ID."

[[board]]
name = "life_karolinska"
type = "link_scan"
group = "life_sciences"
enabled = true
