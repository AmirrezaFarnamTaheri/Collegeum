# Official high-value discovery targets without a verified end-to-end scraper.
# In particular, programme pages are NOT individual job cards, and ETH may
# advertise Singapore jobs; neither case can be treated as local to Europe.
[[board]]
name = "life_eth_jobs"
type = "link_scan"
group = "life_sciences"
enabled = false
url = "https://www.jobs.ethz.ch/site/index"
link_pattern = '(?:www\.)?jobs\.ethz\.ch/job/view/(?:\d+|JOPG_[^/?#]+)'
institution = "ETH Zurich"
note = "OFF: listing loads dynamically and some ETH roles are outside Switzerland."

