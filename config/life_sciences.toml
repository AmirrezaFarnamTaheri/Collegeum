# Official institutions to verify before enabling: their doctoral programmes
# and recruitment links change and some listings are JavaScript-rendered.
[[board]]
name = "life_embl"
type = "workday"
group = "life_sciences"
enabled = true
# Official EMBL career page links to this multi-country public Workday site.
# Live runner #41191392906: 20 distinct jobs, zero errors. Some are based
# in UK Hinxton; no default Germany country is allowed.
url = "https://embl.wd103.myworkdayjobs.com/en-US/EMBL"
institution = "EMBL"
max_pages = 3
search_terms = [""]
require_deadline = true
min_interval = 3.0
verification = "official_workday_recruitment_20261031"
note = "Official multi-country Workday site; a functional staff feed does not prove currently open doctoral positions."

