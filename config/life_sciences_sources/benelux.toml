# Life Sciences PhD source catalogue - benelux
# Indexed sites were checked against public vacancy examples as of 2026-10-11.
# enabled=true means an official listing and link shape were inspected, NOT guaranteed live scraping.
# Candidate portals are disabled until individual listing anchors and site access rules are verified.

[[board]]
name = "life_utrecht_university"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://www.uu.nl/en/organisation/working-at-utrecht-university/jobs"
link_pattern = 'uu\.nl/en/organisation/working-at-utrecht-university/jobs/(?!kandidatenportal)[a-z0-9][a-z0-9-]+/?'
country = "Netherlands"
institution = "Utrecht University"
min_interval = 3.0
verification = "listing_and_vacancy_url"
note = "Official Utrecht University vacancies have job-specific /jobs/slug links; RNA Huntington's PhD observed."

[[board]]
name = "life_radboud_university"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://www.ru.nl/en/working-at/job-opportunities"
link_pattern = 'ru\.nl/en/working-at/job-opportunities/[a-z0-9][a-z0-9-]+/?'
country = "Netherlands"
institution = "Radboud University"
min_interval = 3.0
verification = "listing_and_vacancy_url"
note = "Official Radboud job listing has detail URLs /job-opportunities/slug, including funded doctoral openings."

