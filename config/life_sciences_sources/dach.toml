# Life Sciences PhD source catalogue - dach
# Indexed sites were checked against public vacancy examples as of 2026-10-11.
# enabled=true means an official listing and link shape were inspected, NOT guaranteed live scraping.
# Candidate portals are disabled until individual listing anchors and site access rules are verified.

[[board]]
name = "life_basel_university"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://jobs.unibas.ch/?lang=en"
link_pattern = 'jobs\.unibas\.ch/offene-stellen/[^/?#]+/[0-9a-f]{8}-[0-9a-f-]{27,36}'
country = "Switzerland"
institution = "University of Basel"
min_interval = 3.0
verification = "listing_and_vacancy_url"
note = "Official University of Basel jobs include funded biomedical PhD roles; detail href is slug/UUID."

[[board]]
name = "life_basel_biozentrum"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://www.biozentrum.unibas.ch/open-positions"
link_pattern = 'biozentrum\.unibas\.ch/open-positions/detail/[^/?#]+'
country = "Switzerland"
institution = "Biozentrum, University of Basel"
min_interval = 3.0
verification = "listing_and_vacancy_url"
note = "Official Biozentrum open positions include current molecular biology PhD detail pages."

