# Rotated topic cohorts of official EURAXESS and AcademicTransfer search pages.
# No new third-party domains; URLs migrated 1:1 from the former 19/15-URL sources.
# Individual postings must still pass doctoral, research and explicit country checks.

[[board]]
name = "life_euraxess_gene_regulation"
type = "link_scan"
group = "life_sciences"
enabled = true
urls = [
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Agene%20regulation",
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Ahistone",
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Amethylation",
  "https://euraxess.ec.europa.eu/jobs/search?f%5B0%5D=keywords%3Aregulatory%20genomics",
]
link_pattern = 'euraxess\.ec\.europa\.eu/jobs/\d+$'
institution_from_context = true
min_interval = 3.0
verification = "official_aggregator_search_partition"
note = "Partition of original EURAXESS discovery keywords: regulation, histones and methylation."

