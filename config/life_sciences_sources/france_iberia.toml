# Life Sciences PhD source catalogue - france_iberia
# Indexed sites were checked against public vacancy examples as of 2026-10-11.
# enabled=true means an official listing and link shape were inspected, NOT guaranteed live scraping.
# Candidate portals are disabled until individual listing anchors and site access rules are verified.

[[board]]
name = "life_inria"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://recrutement.inria.fr/public/classic/en/offres"
link_pattern = 'recrutement\.inria\.fr/public/classic/en/offres/\d{4}-\d+'
country = "France"
institution = "Inria"
min_interval = 3.0
verification = "listing_and_vacancy_url"
note = "French national digital research institute: official paged vacancy list and /offres/YYYY-ID detail links."

[[board]]
name = "life_ibec_barcelona"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://ibecbarcelona.eu/careers-at-ibec/jobs/jobs-scientific-and-technical-job-opportunities/"
link_pattern = 'ibecbarcelona\.eu/(?:phd|ph-d|predoctoral)[a-z0-9-]*/?'
country = "Spain"
institution = "Institute for Bioengineering of Catalonia"
min_interval = 3.0
verification = "listing_and_vacancy_url"
prefer_card_heading = true
note = "Official IBEC jobs link to biomedical doctoral adverts; use card heading because clickable link labels may be vacancy codes."

