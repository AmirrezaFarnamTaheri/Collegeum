# Life Sciences PhD source catalogue - nordics
# Indexed sites were checked against public vacancy examples as of 2026-10-11.
# enabled=true means an official listing and link shape were inspected, NOT guaranteed live scraping.
# Candidate portals are disabled until individual listing anchors and site access rules are verified.

[[board]]
name = "life_lund_university"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://www.lunduniversity.lu.se/vacancies"
link_pattern = 'lu\.varbi\.com/(?:en|se)/what(?::|%3A)job/jobID(?::|%3A)\d+'
country = "Sweden"
institution = "Lund University"
min_interval = 3.0
verification = "listing_and_vacancy_url"
note = "Official Lund vacancies link to Varbi jobID pages; genomic and neurogenetics PhDs observed."

[[board]]
name = "life_umea_university"
