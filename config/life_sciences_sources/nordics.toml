[[board]]
name = "life_nordic_linkoping"
type = "link_scan"
group = "life_sciences"
enabled = true
url = "https://web103.reachmee.com/ext/I011/853/main?lang=UK&site=7&validator=d7a66c13be778ef950c393a904293789"
link_pattern = '^https://web103[.]reachmee[.]com/ext/I011/853/job[?](?:[^#]*[&])?job_id=[0-9]+(?:[&#]|$)'
# Only fetch doctoral vacancies; other research fields remain subject to full-text checks.
title_allow_pattern = '^(?:Ph[.]?D[.]?|Doctoral|Doktorand)\b'
country = "Sweden"
institution = "Linkoping University"
min_interval = 3.0
verification = "listing_and_vacancy_url"
note = "Official Linkoping ReachMee English jobs, job_id is unique inside tenant I011/853. Institution landing page exposes only a listing shell. Observed 22 official job-specific links on a robots-aware GitHub runner 40961785241; doctoral-title guard retains only PhD positions. Revalidate stable job identities and field eligibility in production."

