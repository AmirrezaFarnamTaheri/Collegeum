# What the bot should send you. Edit in the GitHub web editor; the next run uses it.
#
# Terms are case-insensitive; "-" and " " are interchangeable ("pre-doc" == "pre doc"
# == "predoc"); a trailing * is a prefix match ("econom*" -> economics, economist...);
# a leading * also allows letters before it ("*econom*" -> macroeconomics).
#
# These rules run on EVERY position, whichever source found it and whether or not a
# Gemini key is set, so the model can never send you something these rules forbid.

[filters]
# Unmistakable predoc wording (big score boost, overrides title exclusions).
strong_terms = [
  "pre-doc*", "pre-phd*", "research professional", "staff associate",
  "wissenschaftliche* mitarbeiter*", "wissenschaftliche* hilfskraft*",
  "personal investigador predoctoral*", "personal investigador en formacion", "personal investigador en formación",
  "assistant* de recherche*", "allocataire* de recherche predoctoral*", "chercheur* predoctoral*",
  "assegnista* di ricerca*", "borsista* di ricerca*",
]

# Research roles (these also need an economics/business/policy field word somewhere).
role_terms = [
  "research assistant*", "research associate*", "research analyst*", "research economist*", "research officer*", "research specialist*",
  "research trainee*", "research intern*", "junior researcher*", "junior economist*", "assistant researcher*", "graduate researcher*",
  "economic analyst*", "economic associate*", "central bank trainee*",
  "postdoc*", "post-doc*", "postdoctoral*", "research fellow*",
  "phd candidate*", "phd researcher*", "phd student*", "doctoral researcher*", "doctoral candidate*", "doctoral student*",
  "promotionsstelle*", "doktorandenstelle*", "doktorand*", "promovierend*",
  "shk", "whk", "wimi", "studentische* hilfskraft*",
  "ayudante* de investigacion*", "ayudante* de investigación*", "asistente* de investigacion*", "asistente* de investigación*",
  "chargé* d'études économiques", "charge* d'etudes economiques", "assistente* di ricerca",
]

# WANTED fields: economics, business, political/social science, law.
field_terms = [
  "*econom*", "political economy", "public policy", "fiscal", "monetary", "labour",
  "labor market*", "tax*", "inequality", "poverty", "financ*", "banking",
  "accounting", "marketing", "entrepreneurship", "organizational behavior", "organisational behaviour", "operations management",
  "consumer behavio*", "political science", "international relations", "public administration", "social science*", "quantitative social",
  "sociology", "demography",
  "wirtschaftswissenschaft*", "volkswirtschaft*", "betriebswirtschaft*", "vwl", "bwl", "ökonomie", "oekonomie",
  "sciences economiques", "sciences économiques", "economie", "économie", "économétrie", "econometrie",
  "ciencias economicas", "ciencias económicas", "economia", "economía", "econometría", "econometria",
  "sozialwissenschaft*",
]

# Everyday words: count as a field in a title/department, but on a full job page they
# only count together with one of the core words above.
field_terms_weak = [
  "business", "management", "strategy", "policy", "trade", "politics",
  "government", "law", "legal",
]

# UNWANTED fields: rejected unless a wanted field is also named.
field_exclude_terms = [
  "medicine", "medical", "clinical", "biomedical", "*biolog*", "bioinformatic*",
  "biostatistic*", "neuroscience*", "neurology", "neuroimaging", "genetic*", "genomic*",
  "molecular", "cell", "cancer", "oncology", "immunology", "pharmac*",
  "chemistry", "chemical", "physics", "engineering", "computer science", "robotics",
  "materials science", "psychology", "psychiatry", "psychiatric", "nursing", "epidemiology",
  "health sciences", "dentistry", "veterinary", "ecology", "zoology", "botany",
  "agronomy", "laboratory", "wet lab", "protein*", "astronomy", "geology",
  "radiology", "surgery", "cardiology", "pediatric*", "paediatric*", "arts",
  "art history", "humanities", "philosophy", "history", "literature", "linguistics",
  "music", "theatre", "theater", "film", "journalism", "editorial",
  "architecture",
]

# Rejected when found in the TITLE (unless a strong role/predoc term is there too).
exclude_terms = [
  "professor*", "lecturer*", "tenure*", "faculty position*",
  "faculty member*", "reader in", "senior lecturer*",
  "head of", "director of", "chair in", "dean", "group leader", "clinical",
  "nurse", "lab technician", "laboratory technician", "scholarship*", "summer school", "conference",
  "call for papers", "workshop", "seminar", "master's", "masters",
  "msc", "equity research", "credit research", "investment research", "event driven", "sell side",
  "buy side", "private equity", "hedge fund", "trading", "trader", "sales",
  "real estate", "market research", "semiconductor*", "wealth management",
  "portfolio", "underwriting", "actuar*",
]

# Drop "PhD student / doctoral candidate" jobs (set false to include them).
exclude_phd_positions = false

# Who the employer may be: universities, business/economics schools, research institutes,
# central banks, international organizations, and economic research consultancies.
employer_allow_patterns = [
  "univ", "college", "school", "institut", "hochschule", "[ée]cole",
  "escuela", "scuola", "politecnico", "academy", "akademie", "faculty",
  "department", "graduate", 'centre\b', 'center\b', "research (unit|group|lab|laboratory|foundation|council|department|programme|program)", '\blab\b',
  "laborator", "observatory", "max planck", "leibniz", "fraunhofer", "cnrs",
  "csic", "sorbonne",
  "central bank", "reserve bank", "federal reserve", "monetary authority",
  "international organization", "international organisation", "economic consulting",
]

# Well-known academic, policy, and research employers:
employer_allow_names = [
  "CEMFI", "CREI", "EUI", "INSEAD", "IESE", "ESADE", "HEC", "ESSEC",
  "EDHEC", "LBS", "LSE", "UCL", "ETH", "EPFL", "Bocconi", "Sciences Po",
  "CEPR", "IZA", "ZEW", "DIW", "ifo", "IWH", "RWI", "briq",
  "WZB", "IIES", "IFAU", "VATT", "ETLA", "CPB", "ESRI", "NIESR",
  "IFS", "Bruegel", "CERGE-EI", "CERGE", "WIFO", "IHS", "Tinbergen", "Collegio Carlo Alberto",
  "EIEF", "Nuffield", "CREST", "TSE", "PSE", "UPF", "UAB", "UC3M",
  "KU Leuven", "NHH", "SSE", "IIASA", "Resolution Foundation", "Rockwool Foundation", "Kiel", "CEBI",
  "CAGE", "STICERD", "CEP", "IGIER", "LEAP", "Frisch",
  # Central Banks & Multilateral Institutions
  "Federal Reserve", "Fed", "ECB", "European Central Bank", "Bank of England", "Bank of Canada",
  "BIS", "Bank for International Settlements", "Bundesbank", "Deutsche Bundesbank",
  "Banque de France", "Banca d'Italia", "Banco de España", "Riksbank", "Swiss National Bank", "SNB",
  "De Nederlandsche Bank", "DNB", "Norges Bank", "Reserve Bank of Australia", "RBA",
  "OECD", "IMF", "International Monetary Fund", "World Bank", "WTO", "World Trade Organization",
  "IDB", "Inter-American Development Bank", "EBRD", "EIB", "European Investment Bank",
  "Asian Development Bank", "ADB", "UN", "United Nations", "ILO",
  # Economic Consultancies & Policy Institutes
  "Cornerstone Research", "Analysis Group", "NERA Economic Consulting", "NERA",
  "Charles River Associates", "CRA", "Compass Lexecon", "The Brattle Group", "Brattle",
  "Bates White", "Keystone Strategy", "Mathematica", "MDRC", "RAND Corporation", "RAND",
  "RTI International", "Urban Institute", "Brookings", "Brookings Institution",
  # Premier US Academic Pre-doc & Research Hubs
  "Opportunity Insights", "BFI", "Becker Friedman Institute", "SIEPR", "Tobin Center",
  "Blueprint Labs", "J-PAL", "JPAL", "National Bureau of Economic Research", "NBER",
]

# Non-research commercial retail operations:
employer_block_patterns = [
  "retail bank|mortgage|credit union", "securities", "capital", "investment", "asset management", "wealth",
  "hedge", "trading", "advisors?", "advisory", "partners",
  "holdings?", 'group\b', '\b(inc|ltd|llc|plc|corp|corporation|gmbh|ag|sa|spa|bv|ab|as)\b\.?', "& co", "insurance", "real estate",
  "pharma", "energy", "technologies", "solutions",
]

# Never send these (matched in employer, title and link):
excluded_employers = []

regions_include = ["UK", "Europe", "Canada", "US", "Other"]
keep_unknown_region = true   # keep jobs whose location couldn't be detected
drop_expired = true
max_age_days = 120           # ignore postings older than this (when a post date is known)

[enrich]
fetch_details = true         # read every new posting's page (field, region, filled?) before sending
max_details_per_run = 2500   # the rest wait for the next run
detail_concurrency = 25
recheck_open_jobs = true     # revisit sent jobs so filled ones drop off /positions and the dashboard
recheck_every_days = 3
recheck_max_per_run = 500

[http]
timeout = 30
max_retries = 3
default_min_interval = 1.5   # polite delay between requests to the same site (seconds)
max_concurrent_sources = 12
source_timeout = 600         # give up on a source that hangs longer than this (seconds)

[telegram]
list_page_size = 5           # positions per message for /positions, /applied...
list_max = 60                # most positions one command shows
digest_page_size = 6         # positions per message when many are new at once
alert_on_source_failures = 3 # warn when a source failed 3 runs in a row (0 = off)
