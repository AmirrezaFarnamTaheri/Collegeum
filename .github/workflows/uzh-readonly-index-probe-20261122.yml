name: uzh-readonly-index-probe

# One-shot investigation on a disposable branch, no credentials or writes.
on:
  push:
    branches:
      - investigate/uzh-runner-source-state-20261122

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          activate-environment: true
      - name: Install locked dependencies
        run: uv sync --locked --extra portals
      - name: Inspect official UZH index once (aggregate output only)
        env:
          PYTHONPATH: src
        run: python -m tools.verify_uzh_live
