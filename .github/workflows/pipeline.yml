name: predoc-pipeline

# Runs every four hours: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC.
# GitHub may start scheduled runs 5-30 minutes late; that is normal.
#
# Runtime and Actions usage depend on collection and extraction volume.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Ingest and gate only; send nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with telegram.yml: the two jobs both commit to data/, so they must
# never run at the same time. A run in progress is never cancelled.
# Queue multiple waiting runs rather than replacing the pending run.
concurrency:
  group: predoc-bot
  cancel-in-progress: false
  queue: max

jobs:
  run:
    # Scheduled/manual publication must never execute unreviewed branch code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # ref: the branch, not the commit that triggered the run. A run that
      # waited in the queue behind the other workflow must start from the
      # newest data, not from the state before that run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Check private state repository is private
        if: ${{ vars.PRIVATE_STATE_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
          PRIVATE_STATE_REPO: ${{ vars.PRIVATE_STATE_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PRIVATE_STATE_TOKEN is required for PRIVATE_STATE_REPO"
            exit 1
          fi
          if [ "$(gh api "repos/$PRIVATE_STATE_REPO" --jq '.private')" != "true" ]; then
            echo "::error::Refusing to store subscriber state in a public repository"
            exit 1
          fi

      - name: Checkout authoritative private state
        if: ${{ vars.PRIVATE_STATE_REPO != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PRIVATE_STATE_REPO }}
          token: ${{ secrets.PRIVATE_STATE_TOKEN }}
          path: .private-state
          fetch-depth: 1

      - name: Restore authoritative private state
        if: ${{ vars.PRIVATE_STATE_REPO != '' }}
        run: python tools/private_state.py restore

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
          enable-cache: true

      - name: Install locked pipeline dependencies
        run: |
          uv lock --check
          uv sync --locked --extra portals

      # Restores the SQLite cache from data/listings.ndjson + data/seen.ndjson
      # (the committed state) when it is absent, so a fresh runner never
      # re-sends old positions or re-reads pages it has already judged.
      # With no GEMINI_API_KEY the rule-based (heuristic) extractor is used.
      - name: Run pipeline
        id: pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FEEDBACK_ENCRYPTION_KEY: ${{ secrets.FEEDBACK_ENCRYPTION_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openrouter/free' }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MEMO_API_KEY: ${{ secrets.MEMO_API_KEY }}
          CUSTOM_LLM_API_KEY: ${{ secrets.CUSTOM_LLM_API_KEY }}
          CUSTOM_LLM_BASE_URL: ${{ vars.CUSTOM_LLM_BASE_URL || secrets.CUSTOM_LLM_BASE_URL }}
          EXTRACTION_BACKEND: ${{ vars.EXTRACTION_BACKEND || 'auto' }}
          SITE_URL: ${{ vars.SITE_URL }}
          ENABLE_JOBSPY: ${{ vars.ENABLE_JOBSPY || 'false' }}
          ENABLE_TWITTER: ${{ vars.ENABLE_TWITTER || 'false' }}
          TWSCRAPE_ACCOUNTS: ${{ secrets.TWSCRAPE_ACCOUNTS }}
          X_BROADCAST_ENABLED: ${{ vars.X_BROADCAST_ENABLED || 'true' }}
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XQUIK_API_KEY: ${{ secrets.XQUIK_API_KEY }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          SOURCE_ROTATION_ENABLED: ${{ github.event_name == 'schedule' }}
          ENABLE_CAREER_FEEDS: 'true'
        run: |
          set -o pipefail
          FLAG=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then FLAG="--dry-run"; fi
          PYTHONPATH=src python3 -m predoc_pipeline.cli run $FLAG 2>&1 | tee run.log
        continue-on-error: true

      # continue-on-error above means a pipeline failure would otherwise leave
      # this job green. This step makes the job's real outcome authoritative,
      # while still letting the commit step below save a partial success.
      - name: Evaluate outcome
        env:
          PIPELINE_OUTCOME: ${{ steps.pipeline.outcome }}
        run: |
          # A partial run exits successfully by design. A failing process
          # must never be reclassified by a string in stdout/stderr.
          if [ "$PIPELINE_OUTCOME" != "success" ]; then
            echo "Pipeline command failed; inspect the preserved run log."
            exit 1
          fi

      # data/predocs.db is gitignored (see state.py): only text state is
      # committed. `git pull --rebase` first, in case you edited a file on
      # GitHub while the run was going.
      - name: Commit updated state
        if: ${{ always() && steps.pipeline.outcome != 'skipped' && github.event.inputs.dry_run != 'true' }}
        env:
          PRIVATE_STATE_REPO: ${{ vars.PRIVATE_STATE_REPO }}
        run: |
          set -euo pipefail
          git config user.name "predoc-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/listings.ndjson data/seen.ndjson data/x_threads.ndjson \
                   data/career_jobs.ndjson data/career_health.json \
                   data/source_rotation.json docs/data/listings.json \
                   docs/data/health.json docs/feed.xml; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if [ -z "$PRIVATE_STATE_REPO" ]; then
            for f in data/feedback.enc data/telegram_state.json; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: update listings [skip ci]"
            if ! (git pull --rebase --autostash && git push); then
              git rebase --abort 2>/dev/null || true
              echo "::error::Cannot persist pipeline journals without conflicts"
              exit 1
            fi
          fi

      - name: Commit private pipeline state
        if: ${{ always() && steps.pipeline.outcome != 'skipped' && github.event.inputs.dry_run != 'true' && vars.PRIVATE_STATE_REPO != '' }}
        run: python tools/private_state.py checkpoint

      - name: Preserve quarantined career journals
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: career-quarantine-${{ github.run_id }}
          path: data/career_jobs.ndjson.corrupt-*
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload dead-letter queue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dlq-${{ github.run_id }}
          path: |
            dlq-failures.json
            run.log
          retention-days: 14
          if-no-files-found: ignore
