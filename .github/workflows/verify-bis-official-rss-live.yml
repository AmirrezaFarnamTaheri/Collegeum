name: verify-bis-official-rss-live
on:
  workflow_dispatch:
  push:
    branches:
      - fix/bis-rss-workplace-provenance-20261031
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          activate-environment: true
      - run: uv sync --locked
      - name: Inspect official BIS RSS via production adapter, without publishing
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python3 - <<'PY'
          import asyncio
          import json
          import re
          from urllib.parse import urlsplit
          from predoc_pipeline.boards.config import HttpConfig, load_board_sources
          from predoc_pipeline.boards.collector import build_http
          from predoc_pipeline.boards.scrapers.rss import RSSScraper

          source = next(s for s in load_board_sources("config/sources.toml") if s.name == "bis")
          assert source.enabled and source.type == "rss" and source.country is None
          assert source.opt("infer_country_from_summary") is True

          async def run():
              async with build_http(HttpConfig(timeout=18, max_retries=0)) as http:
                  scraper = RSSScraper(source, http)
                  jobs, _ = await scraper.run()
                  assert not scraper.discovery_fetch_errors
                  assert not scraper.discovery_parse_errors
                  assert jobs, "BIS official RSS returned no entries; do not call it verified empty"
                  for job in jobs:
                      parsed = urlsplit(job.url)
                      assert parsed.scheme == "https"
                      assert parsed.hostname in {"www.bis.org", "bis.org"}
                      assert parsed.port in (None, 443)
                      assert re.fullmatch(r"/vacancy/jr[0-9]+", parsed.path)
                      assert not job.extra.get("source_country_default")
                      assert job.country is None or job.location, "Country requires vacancy-specific workplace"
                  hong_kong = [j for j in jobs if "Data Scientist / Research Analyst" in j.title]
                  assert hong_kong, "Expected official Hong Kong research vacancy absent"
                  assert all(j.country == "Hong Kong" for j in hong_kong)
                  assert any(j.country == "Switzerland" for j in jobs)
                  assert all(j.country != "Switzerland" for j in hong_kong)
                  print(json.dumps({
                      "source": source.name, "status": "discovered",
                      "general_vacancies": len(jobs),
                      "unique_urls": len({j.url for j in jobs}),
                      "doctoral_titles": sum("phd" in j.title.lower() for j in jobs),
                      "data_science_research_titles": sum(
                          "research analyst" in j.title.lower() for j in jobs),
                      "discovery_errors": scraper.discovery_parse_errors,
                      "country_evidence": "explicit RSS vacancy workplace where available",
                      "hong_kong_analysts": len(hong_kong),
                      "switzerland_jobs": sum(j.country == "Switzerland" for j in jobs),
                      "unknown_location_jobs": sum(j.country is None for j in jobs),
                  }, indent=2))
          asyncio.run(run())
          PY
