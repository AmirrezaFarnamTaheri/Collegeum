name: verify-career-providers

# Manual source verification; never runs with Telegram secrets or subscriber data.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
          enable-cache: true
      - name: Install locked provider dependencies
        run: uv sync --locked
      - name: Probe three published provider formats
        run: PYTHONPATH=src python3 tools/probe_career_sources.py --output build/career-probe.json
      - name: Preserve provider status report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: career-provider-probe-${{ github.run_id }}
          path: build/career-probe.json
          retention-days: 14
          if-no-files-found: warn
