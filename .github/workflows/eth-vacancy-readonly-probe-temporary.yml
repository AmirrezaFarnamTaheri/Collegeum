name: ETH Law Economics Public Vacancy Probe - Temporary
on:
  push:
    branches: [fix/eth-law-econ-vacancy-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Verify official ETH source parser against public JSON (read only)
        env:
          PYTHONPATH: src
        run: |
          uv run pytest -q tests/boards/test_eth_softfactors_source.py
          uv run python - <<'PY'
          import asyncio
          from predoc_pipeline.boards.collector import _scrape_all
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers import SCRAPERS

          async def main():
              source=next(s for s in load_board_sources("config/sources.toml")
                          if s.name=="eth_lawecon")
              async with HttpClient(timeout=25,max_retries=0,default_min_interval=0.3) as http:
                  res=(await _scrape_all([SCRAPERS[source.type](source,http)],1,50))[0]
                  print("ETH_SOURCE_HEALTH",res.as_stats(),flush=True)
                  print("ETH_MATCHED_POSTINGS",[(p.title,p.url,p.field_implied)
                                                for p in res.posts],flush=True)
                  assert res.ok, "ETH official adapter returned partial source errors"
                  assert any("Research Assistants" in p.title for p in res.posts)
                  assert all(p.field_implied is False for p in res.posts)
          asyncio.run(main())
          PY
