name: ETH Law Economics Public Vacancy Probe - Temporary
on:
  push:
    branches: [fix/eth-law-econ-vacancy-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect official ETH Softfactors vacancy feed schema (read-only)
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import json
          from predoc_pipeline.boards.http import HttpClient

          URL = ("https://lawecon.ethz.ch/group/open-positions/"
                 "_jcr_content/par/jobs.softfactors.json")
          ORGS = ("https://lawecon.ethz.ch/group/open-positions/"
                  "_jcr_content/par/jobs.getorg.json?lzdesc=")

          async def main():
              async with HttpClient(timeout=20, max_retries=0, default_min_interval=0.2) as http:
                  for url in [URL, ORGS]:
                      try:
                          response=await http.get_text(url)
                          print("ENDPOINT",url,"BYTES",len(response),flush=True)
                          try:
                              data=json.loads(response)
                              if isinstance(data, dict):
                                  print("KEYS",list(data)[:25],flush=True)
                                  for k,v in data.items():
                                      print("FIELD",k,"TYPE",type(v).__name__,"LEN",len(v) if isinstance(v,(dict,list,str)) else "-",flush=True)
                                      if isinstance(v,list):
                                          for item in v[:2]:
                                              print("ITEM",repr(item)[:1600],flush=True)
                                      elif isinstance(v,dict):
                                          print("DICT_SAMPLE",repr(list(v.items())[:2])[:1500],flush=True)
                              elif isinstance(data,list):
                                  print("LIST_ITEMS",len(data),flush=True)
                                  for item in data[:3]:
                                      print("ITEM",repr(item)[:2200],flush=True)
                              else:
                                  print("SCALAR",repr(data)[:1000],flush=True)
                          except json.JSONDecodeError:
                              print("NOT_JSON",repr(response[:1000]),flush=True)
                      except Exception as e:
                          print("FETCH_ERROR",url,type(e).__name__,str(e)[:230],flush=True)
          asyncio.run(main())
          PY
