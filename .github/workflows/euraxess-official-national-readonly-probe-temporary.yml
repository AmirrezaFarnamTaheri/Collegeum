name: euraxess-official-national-readonly-probe-temporary

on:
  push:
    branches: [investigate/euraxess-official-national-20261029]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read-only reachability and robots policy for EURAXESS portals
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser
          from urllib.robotparser import RobotFileParser

          HOSTS = [
              "https://euraxess.ec.europa.eu",
              "https://www.euraxess.se",
              "https://www.euraxess.fi",
              "https://www.euraxess.de",
          ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a" and dict(attrs).get("href"):
                      self.links.append(dict(attrs)["href"])

          def scan(host):
              start = time.monotonic()
              robots_url = host + "/robots.txt"
              listing_url = host + "/jobs/search"
              def fetch(url):
                  req = urllib.request.Request(url, headers={
                      "User-Agent": "Collegeum-source-health-check/1.0",
                      "Accept": "text/html,text/plain;q=0.9,*/*;q=0.8",
                  })
                  with urllib.request.urlopen(req, timeout=14) as resp:
                      return resp.status, resp.geturl(), resp.read(1000000)
              try:
                  code, final, raw = fetch(robots_url)
                  rp = RobotFileParser()
                  rp.parse(raw.decode("utf-8", "replace").splitlines())
                  allowed = rp.can_fetch("Collegeum-source-health-check", listing_url)
                  print("ROBOTS",host,"status",code,"final",final,
                        "allows",allowed,flush=True)
                  if not allowed:
                      print("SKIP",host,"robots_disallowed",flush=True)
                      return
              except Exception as e:
                  print("ROBOTS_ERROR",host,type(e).__name__,
                        str(getattr(e, "code", ""))[:25],flush=True)
                  return
              try:
                  status, final, payload = fetch(listing_url)
                  parser = Links()
                  parser.feed(payload.decode("utf-8", "replace"))
                  job_links = [u for u in parser.links
                               if re.search(r"/jobs/(?:\d{5,}|[a-z0-9-]{15,})",u,re.I)]
                  print("SEARCH",host,"status",status,"final",final,
                        "bytes",len(payload),"links",len(parser.links),
                        "candidate_links",len(job_links),
                        "elapsed",round(time.monotonic()-start,1),flush=True)
                  for item in job_links[:4]:
                      print("CANDIDATE",host,item[:180],flush=True)
              except Exception as e:
                  print("SEARCH_ERROR",host,type(e).__name__,
                        str(getattr(e, "code", ""))[:25],
                        "elapsed",round(time.monotonic()-start,1),flush=True)

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(scan, HOSTS))
          PY
