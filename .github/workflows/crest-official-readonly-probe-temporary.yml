name: crest-official-readonly-probe-temporary
on:
  push:
    branches: [investigate/crest-official-source-20261029]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check only official CREST public endpoints
        run: |
          python3 - <<'PY'
          import re
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      self.hrefs.extend(v for k, v in attrs if k == "href" and v)

          for url in [
              "https://crest.science/opportunities-2/",
              "https://new.crest.science/opportunities-2/",
              "https://crest.science/robots.txt",
              "https://new.crest.science/robots.txt",
          ]:
              print("SOURCE", url, flush=True)
              try:
                  with urllib.request.urlopen(
                      urllib.request.Request(url, headers={"User-Agent": "Collegeum-research-source-check/1.0"}),
                      timeout=10,
                  ) as response:
                      payload = response.read(750_000)
                      text = payload.decode("utf-8", "replace")
                      parser = Links()
                      parser.feed(text)
                      matches = [x for x in parser.hrefs if "pdf" in x.lower() or "job" in x.lower()]
                      print("RESULT", response.status, response.url, len(payload), "JOB_LINK_COUNT", len(matches), flush=True)
                      print("MATCHING_LINKS", matches[:15], flush=True)
                      print("TITLE", re.findall(r"<title[^>]*>(.*?)</title>", text, re.I | re.S)[:1], flush=True)
                      if url.endswith("robots.txt"):
                          print("ROBOTS_HEAD", text[:1400], flush=True)
              except urllib.error.HTTPError as e:
                  print("HTTP_ERROR", e.code, str(e.url), flush=True)
              except Exception as e:
                  print("ERROR", type(e).__name__, str(e)[:160], flush=True)
          PY
