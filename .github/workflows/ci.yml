name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# GitHub API pushes may not always emit pull_request synchronization;
# validate both branch pushes and PR events. Isolate their cancellation keys:
# sharing a single commit-SHA key cancels one event's matrix midway while the
# other PR run can remain queued. Only supersede older runs of the same event
# and PR (or branch), never the other event's check suite.
concurrency:
  group: collegeum-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Runs first and separately: this is the suite that needs nothing
      # installed at all, so a break here means the core itself regressed
      # rather than some dependency's API changing underneath it.
      - name: Core tests (stdlib only, no dependencies installed)
        run: PYTHONPATH=src python3 -m unittest discover -s tests/core -t . -v

      - name: Validate committed dashboard, RSS and journal contracts (stdlib only)
        run: python3 -S tools/audit_publications.py --strict --json-report build/publication-audit.json

      - name: Preserve complete output-quality diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-audit-py${{ matrix.python-version }}
          path: build/publication-audit.json
          if-no-files-found: ignore

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          activate-environment: true
          enable-cache: true

      - name: Install exact locked test environment
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv lock --check
          uv sync --locked --python "$PYTHON_VERSION" --extra dev --extra portals

      - name: Build and verify single-file distribution
        run: |
          python3 tools/build_single_file.py
          python3 -S tools/verify_single_file.py

      - name: Gate eval (precision/recall against golden fixtures)
        run: PYTHONPATH=src python3 -m predoc_pipeline.cli eval

      - name: Offline smoke check
        run: PYTHONPATH=src python3 -m predoc_pipeline.cli smoke

      - name: Audit committed publication outputs
        run: |
          PYTHONPATH=src python3 tools/audit_pipeline_outputs.py \
            --output build/output-audit.json

      - name: Lint
        run: ruff check src tests tools

      - name: Type check
        run: mypy src

      - name: Full test suite with coverage
        run: |
          PYTHONPATH=src python3 -m pytest tests/ \
            --cov=predoc_pipeline --cov-report=xml --cov-report=term-missing -v

      - name: Build and verify release archives
        run: |
          uv build --out-dir build/release
          python3 -S tools/verify_release.py

      - name: Enforce stdlib-only core (belt and suspenders)
        run: PYTHONPATH=src python3 -m pytest tests/core/test_no_third_party.py -v

  telegram-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/telegram/package-lock.json
      - run: npm ci
        working-directory: cloudflare/telegram
      - run: npm test
        working-directory: cloudflare/telegram
        env:
          WRANGLER_SEND_METRICS: "false"
