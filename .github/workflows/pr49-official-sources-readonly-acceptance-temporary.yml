name: pr49-official-sources-readonly-acceptance-temporary

on:
  push:
    branches:
      - investigate/copenhagen-runner-source-20261029

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest production code (never persist state)
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - name: Install locked scraper dependencies
        run: uv sync --locked --extra portals
      - name: Collect only the three official PR49 sources (no publication, model or database)
        shell: bash
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import asyncio
          import json
          from pathlib import Path

          from predoc_pipeline.boards.collector import _scrape_all
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers import SCRAPERS
          from predoc_pipeline.core.health import source_status

          NAMES = {"ny_fed", "iies_stockholm", "opportunity_insights"}

          async def main():
              sources = [
                  cfg for cfg in load_board_sources(Path("config/sources.toml"))
                  if cfg.name in NAMES
              ]
              assert {cfg.name for cfg in sources} == NAMES
              async with HttpClient(timeout=15, max_retries=0, default_min_interval=0.2) as http:
                  results = await _scrape_all(
                      [SCRAPERS[cfg.type](cfg, http) for cfg in sources], 3, 55
                  )
              failures = []
              for result in results:
                  stats = result.as_stats()
                  status = source_status(stats)
                  sample = [
                      {"title": post.title[:100], "url": post.url}
                      for post in result.posts[:3]
                  ]
                  print("SOURCE_HEALTH", json.dumps({
                      "name": result.scraper.name,
                      "status": status,
                      "ok": result.ok,
                      "raw": stats["raw"],
                      "may_be_empty": stats["may_be_empty"],
                      "failure_stage": result.failure_stage,
                      "error": result.error,
                      "parse_issues": result.scraper.discovery_parse_errors,
                      "fetch_issues": result.scraper.discovery_fetch_errors,
                      "seconds": stats["seconds"],
                      "samples": sample,
                  }, ensure_ascii=True), flush=True)
                  if status not in {"successful", "empty"}:
                      failures.append(result.scraper.name)
              if failures:
                  raise SystemExit("Official-source acceptance failed: " + ", ".join(failures))

          asyncio.run(main())
          PY
