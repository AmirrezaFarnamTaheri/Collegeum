name: diagnose-dkfz-embl-live-sources

# Read-only official provider validation. No credentials or journal writes.
on:
  push:
    branches:
      - diagnostics/dkfz-embl-recovery-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          activate-environment: true
      - run: uv sync --locked
      - name: Probe official recruitment indexes without publishing
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee providers.json
          import json
          import re
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          from predoc_pipeline.ingest.http import PoliteClient

          pages = {
              "dkfz_en": "https://jobs.dkfz.de/en/jobs",
              "dkfz_de": "https://jobs.dkfz.de/de/jobs",
              "embl_careers": "https://www.embl.org/careers/",
              "embl_workday": "https://embl.wd103.myworkdayjobs.com/en-US/EMBL",
          }
          results = {}
          with PoliteClient(
              user_agent="Collegeum-OfficialRecruitmentProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=18, per_host_delay=3, respect_robots=True,
          ) as http:
              for name, url in pages.items():
                  response = http.get(url, use_cache=False)
                  info = {
                      "url": url, "status": response.status, "ok": response.ok,
                      "error": str(response.error)[:130],
                      "bytes": len(response.content),
                  }
                  if response.ok:
                      soup = BeautifulSoup(response.text, "lxml")
                      links = [
                          {
                              "title": el.get_text(" ", strip=True)[:110],
                              "url": urljoin(url, str(el.get("href", "")))[:220],
                          }
                          for el in soup.select("a[href]")
                          if re.search(r"(?i)(jobs[.]dkfz[.]de/(?:en|de)/jobs/[0-9]+/|myworkdayjobs[.]com/|phd|doctoral)",
                                       urljoin(url, str(el.get("href", "")))
                                       + el.get_text(" ", strip=True))
                      ]
                      info["job_like_links"] = len(links)
                      info["examples"] = links[:18]
                      info["scripts"] = [
                          urljoin(url, str(x.get("src")))[:200]
                          for x in soup.select("script[src]")[:12]
                      ]
                      info["text_start"] = soup.get_text(" ", strip=True)[:180]
                      info["html_contains_phd"] = bool(
                          re.search(r"(?i)phd|doctoral|doktorand", response.text)
                      )
                  results[name] = info
          print(json.dumps(results, ensure_ascii=False, indent=2))
          PY
      - name: Probe public EMBL Workday search adapter and DKFZ HTML job identities
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee provider-contracts.json
          import asyncio
          import json
          import re
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.config import SourceConfig
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers.university_ats import WorkdayScraper
          from predoc_pipeline.ingest.http import PoliteClient

          async def workday():
              source = SourceConfig(
                  name="life_embl", type="workday",
                  url="https://embl.wd103.myworkdayjobs.com/en-US/EMBL",
                  institution="EMBL", max_pages=3, search_terms=[""],
              )
              async with HttpClient(timeout=18, max_retries=0,
                                    default_min_interval=2.0) as http:
                  scraper = WorkdayScraper(source, http)
                  try:
                      posts, count = await scraper.run()
                      return {
                          "ok": True, "vacancies": count,
                          "fetch_errors": scraper.discovery_fetch_errors,
                          "parse_errors": scraper.discovery_parse_errors,
                          "pagination_limits": scraper.discovery_limits,
                          "doctoral_titles": [
                              {"title":p.title[:120],"url":p.url[:220],
                               "location":p.location}
                              for p in posts
                              if re.search(r"(?i)(?:phd|doctoral|predoc|doctorand)",p.title)
                          ][:15],
                          "sample_jobs": [
                              {"title":p.title[:100],"url":p.url[:200],
                               "location":p.location} for p in posts[:7]
                          ],
                      }
                  except Exception as error:
                      return {"ok": False, "type": type(error).__name__,
                              "detail":str(error)[:200]}
          report = {"embl_workday_api": asyncio.run(workday())}
          with PoliteClient(
              user_agent="Collegeum-OfficialRecruitmentProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=18, per_host_delay=3, respect_robots=True,
          ) as http:
              for lang in ("en","de"):
                  url = f"https://jobs.dkfz.de/{lang}/jobs"
                  response = http.get(url, use_cache=False)
                  item = {"status": response.status, "ok": response.ok}
                  if response.ok:
                      body = response.text
                      soup = BeautifulSoup(body, "lxml")
                      item["html_near_first_vacancy"] = body[
                          max(0,body.find("Softwareentwickler")-300):
                          body.find("Softwareentwickler")+460
                      ]
                      item["anchor_hrefs"] = [
                          str(a.get("href", ""))[:160]
                          for a in soup.select("a[href]")[:30]
                      ]
                      item["data_identity_tags"] = [
                          {"name": t.name, "attrs": {
                              k: str(v)[:110] for k,v in t.attrs.items()
                              if k.startswith("data-") or k in ("onclick","href")
                          }}
                          for t in soup.find_all(attrs={"data-job-id": True})[:5]
                      ]
                  report[f"dkfz_{lang}"] = item
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Test existing RSS engine on official DKFZ XML feed
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee dkfz-rss-contract.json
          import asyncio
          import json
          from urllib.parse import urlsplit
          from predoc_pipeline.boards.config import SourceConfig
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers.rss import RSSScraper
          from predoc_pipeline.ingest.life_sciences import _doctoral_title

          async def verify():
              source = SourceConfig(
                  name="life_dkfz", type="rss",
                  url="https://jobs.dkfz.de/en/jobs",
                  institution="German Cancer Research Center (DKFZ)",
                  country="Germany", min_interval=3.0,
              )
              async with HttpClient(timeout=15, max_retries=0,
                                    default_min_interval=2.0) as http:
                  scraper = RSSScraper(source, http)
                  rows, count = await scraper.run()
                  return {
                      "vacancy_links": count,
                      "distinct_urls": len({p.url for p in rows}),
                      "all_job_urls_official": all(
                          urlsplit(p.url).hostname == "jobs.dkfz.de"
                          for p in rows
                      ),
                      "doctoral_titles": [
                          {"title":p.title[:110], "url":p.url[:220]}
                          for p in rows if _doctoral_title(p.title)
                      ][:12],
                      "sample": [
                          {"title":p.title[:110], "url":p.url[:220]}
                          for p in rows[:10]
                      ],
                      "fetch_errors": scraper.discovery_fetch_errors,
                      "parse_errors": scraper.discovery_parse_errors,
                  }
          report = asyncio.run(verify())
          print(json.dumps(report, ensure_ascii=False, indent=2))
          assert report["all_job_urls_official"]
          assert not report["fetch_errors"] and not report["parse_errors"]
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-dkfz-embl-source-probe
          path: |
            providers.json
            provider-contracts.json
            dkfz-rss-contract.json
          if-no-files-found: warn
          retention-days: 14
