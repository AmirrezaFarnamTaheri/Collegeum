name: workday-multipage-shape-probe-temporary
on:
  push:
    branches: [fix/workday-source-integrity-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Audit public Workday pagination and malformed entries
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          import asyncio
          from collections import Counter
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers.university_ats import parse_workday_url

          NAMES = ("ubc", "mcgill", "uchicago_bfi")

          def problems(row):
              issue = []
              if not isinstance(row, dict):
                  return ["non-object"]
              if not isinstance(row.get("title"), str) or not row.get("title", "").strip():
                  issue.append("title")
              if not isinstance(row.get("externalPath"), str) or not row.get("externalPath", "").startswith("/job/"):
                  issue.append("externalPath")
              if row.get("bulletFields") is not None and not isinstance(row["bulletFields"], list):
                  issue.append("bulletFields")
              if isinstance(row.get("bulletFields"), list) and not all(isinstance(x,str) for x in row["bulletFields"]):
                  issue.append("bulletItems")
              if row.get("locationsText") is not None and not isinstance(row["locationsText"], str):
                  issue.append("locationsText")
              if row.get("postedOn") is not None and not isinstance(row["postedOn"], str):
                  issue.append("postedOn")
              return issue

          async def main():
              configs={c.name:c for c in load_board_sources("config/sources.toml")}
              async with HttpClient(timeout=20,max_retries=0,default_min_interval=0.1) as http:
                  for name in NAMES:
                      source=configs[name]
                      host,tenant,site,_=parse_workday_url(source.opt("url"))
                      api=f"https://{host}/wday/cxs/{tenant}/{site}/jobs"
                      max_pages=int(source.opt("max_pages",3))
                      print("SOURCE",name,"MAX_PAGES",max_pages,flush=True)
                      for term in source.opt("search_terms"):
                          prior_ids=set()
                          for page in range(max_pages):
                              offset=page*20
                              try:
                                  data=await http.post_json(api,{"appliedFacets":{},"limit":20,"offset":offset,"searchText":term})
                                  rows=data.get("jobPostings") if isinstance(data,dict) else None
                                  total=data.get("total") if isinstance(data,dict) else None
                                  if not isinstance(rows,list):
                                      print("BAD_RESPONSE",name,repr(term),offset,type(data).__name__,flush=True)
                                      break
                                  bad=Counter(reason for row in rows for reason in problems(row))
                                  ids=[row.get("externalPath") for row in rows if isinstance(row,dict)]
                                  repeated=len(set(ids).intersection(prior_ids))
                                  prior_ids.update(ids)
                                  print("PAGE",name,repr(term),"OFFSET",offset,"BATCH",len(rows),
                                        "TOTAL",total,"BAD",dict(bad),"DUPLICATE_PATHS",repeated,flush=True)
                                  if len(rows)<20 or (isinstance(total,int) and offset+len(rows)>=total):
                                      break
                              except Exception as exc:
                                  print("FETCH_FAIL",name,repr(term),offset,type(exc).__name__,str(exc)[:90],flush=True)
                                  break
                      print("END_SOURCE",name,flush=True)
          asyncio.run(main())
          PY
      - name: Validate complete Workday source health without publication
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          import asyncio
          from predoc_pipeline.boards.collector import _scrape_all
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers.university_ats import WorkdayScraper

          async def main():
              configs={c.name:c for c in load_board_sources("config/sources.toml")}
              async with HttpClient(timeout=24,max_retries=0,default_min_interval=0.2) as http:
                  for name in ("ubc","mcgill","uchicago_bfi"):
                      item=(await _scrape_all([WorkdayScraper(configs[name],http)],1,115))[0]
                      stats=item.as_stats()
                      print("WORKDAY_LIVE_ACCEPT",name,"RAW",stats["raw"],"ERRORS",stats["errors"],
                            "FAILURE_COUNTS",stats["failure_counts"],"STAGE",stats["failure_stage"],flush=True)
                      assert item.ok and stats["raw"]>0, (name,stats)
          asyncio.run(main())
          PY
