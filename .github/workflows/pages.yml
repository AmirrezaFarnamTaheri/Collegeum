name: deploy-dashboard

# Optional web dashboard (docs/index.html) on GitHub Pages.
#
# Off by default: on the Free plan, Pages only works for PUBLIC repositories.
# To turn it on: make the repository public (or use a paid plan), enable
# Settings -> Pages -> Source: "GitHub Actions", then add the repository
# variable ENABLE_PAGES = true (Settings -> Secrets and variables -> Actions ->
# Variables).
# All triggers, including manual dispatch, require ENABLE_PAGES = true.
#
# Triggered after each pipeline / telegram-sync run. A `push` trigger alone
# never fires for the bot's own commits: pushes made with GITHUB_TOKEN do not
# start other workflows.
on:
  workflow_run:
    workflows: ["predoc-pipeline", "telegram-sync"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do not abort an upload/deployment already in progress.
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run executes with main's privileges, so never deploy on
    # untrusted branch completions or failed state-writing runs.
    if: >-
      vars.ENABLE_PAGES == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/configure-pages@v6

      # Only approved public assets belong on Pages, never operator guides.
      - name: Stage public dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/pages/data
          for f in index.html architecture.html favicon.png favicon.svg \
                   feed.xml logo.svg predoc-pipeline.architecture.json \
                   rss.xsl telegram-avatar-512.png telegram-avatar.png; do
            cp "docs/$f" "build/pages/$f"
          done
          for f in listings.json health.json; do
            cp "docs/data/$f" "build/pages/data/$f"
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

      - id: deployment
        uses: actions/deploy-pages@v5
