name: verify-helmholtz-bite-public-search
on:
  push:
    branches: [investigate/life-helmholtz-recruitment-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Verify bounded official B-ite search JSON without publication
        run: PYTHONPATH=src python3 tools/verify_helmholtz_public_search.py
      - name: Verify German official B-ite recruitment cohort
        run: PYTHONPATH=src python3 tools/verify_helmholtz_german.py
