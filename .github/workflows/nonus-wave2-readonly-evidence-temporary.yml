name: nonus-wave2-readonly-evidence-temporary

# One-off robots-aware inspection of disabled European research careers sites.
# Never loads Telegram tokens, private data or sends notifications.
on:
  push:
    branches: [feat/nonus-wave2-evidence-20261030]
    paths: [.github/workflows/nonus-wave2-readonly-evidence-temporary.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name: [wifo_austria_jobs, ceps_brussels_research]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Inspect official vacancy anchors (no activation)
        env:
          SOURCE: ${{ matrix.name }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.ingest.http import PoliteClient
          from tools.probe_life_sciences_sources import PROBE_USER_AGENT
          source = next(s for s in load_board_sources("config/sources.toml")
                        if s.name == os.environ["SOURCE"])
          assert source.enabled is False
          url = source.opt("url")
          with PoliteClient(user_agent=PROBE_USER_AGENT,timeout=15,
                            per_host_delay=3,respect_robots=True) as client:
              response = client.get(url,use_cache=False)
          report={"source":source.name,"url":url,"http_status":response.status}
          if response.ok:
              soup=BeautifulSoup(response.text[:650000],"lxml")
              anchors=soup.select("a[href]")
              matches=[]
              for a in anchors:
                  link=urljoin(url,str(a.get("href") or ""))
                  label=a.get_text(" ",strip=True)
                  if not (urlsplit(link).scheme=="https" and urlsplit(link).hostname):
                      continue
                  if re.search(r"prae.?doc|pre.?doc|phd.?candidate|doctoral|doktorand|research.?assistant|researcher|vacanc|job.?offer|cdn.ceps.eu",label+" "+link,re.I):
                      matches.append({"title":label[:160],"url":link})
              report.update(html_chars=len(response.text),anchors=len(anchors),
                            likely_vacancy_links=matches[:35])
          print(json.dumps(report,indent=2,ensure_ascii=False))
          p=Path("build")/("nonus-"+source.name+".json");p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nonus-evidence-${{ matrix.name }}-${{ github.run_id }}
          path: build/nonus-*.json
          retention-days: 14
          if-no-files-found: warn
