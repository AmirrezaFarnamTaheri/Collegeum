name: verify-life-sciences-branch

# Independent Life Sciences source-health inspection on the expansion branch.
# Does not load Telegram credentials, subscriber IDs or private checkpoints.
on:
  push:
    branches:
      - feat/100-source-guarded-expansion-20261029
    paths:
      - .github/workflows/verify-life-sciences-branch.yml
      - tools/probe_life_sciences_sources.py
      - config/life_sciences.toml
      - config/life_sciences_sources/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 16, 32]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Probe enabled Life Sciences listings without private state
        env:
          OFFSET: ${{ matrix.offset }}
        run: |
          PYTHONPATH=src python3 tools/probe_life_sciences_sources.py \
            --region all --offset "$OFFSET" --limit 16 \
            --output "build/life-sciences-probe-$OFFSET.json"
      - name: Preserve source-health evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: life-sciences-source-health-${{ matrix.offset }}-${{ github.run_id }}
          path: build/life-sciences-probe-*.json
          retention-days: 14
          if-no-files-found: warn
