name: verify-life-dzne-live
on:
  push:
    branches: [feat/life-dzne-dvinci-sitemap-20261030]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Verify DZNE current employer PhD/XML and eligibility without writes
        run: PYTHONPATH=src python3 tools/verify_life_dzne_live.py
