name: phd-admissions-refresh

# Isolated catalogue reconciliation. This never executes vacancy ingestion,
# subscriber delivery, Telegram, or any provider-policy-blocked job-board scan.
on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "17 9 * * *"
    - cron: "17 15 * * *"
    - cron: "17 21 * * *"
  # GitHub can drop cron events. An independently scheduled, successful
  # main-branch Telegram sync provides a fallback *trigger only*.
  # This workflow never reads Telegram secrets or sends messages.
  workflow_run:
    workflows: ["telegram-sync"]
    types: [completed]
    branches: [main]
  # Run the first official-source batch immediately when the checker or
  # seed inventory changes on main. Do not trigger on generated catalogue
  # commits, preventing a self-sustaining Actions loop.
  push:
    branches: [main]
    paths:
      - "tools/update_phd_admissions.py"
      - "tools/phd_admissions_*.py"
      - "tools/audit_phd_admissions.py"
      - "config/phd_admissions_seeds.json"
      - "tools/update_official_calls.py"
      - "config/official_phd_calls_sources.json"
      - ".github/workflows/phd-admissions-refresh.yml"
  workflow_dispatch:
    inputs:
      full_recheck:
        description: "Recheck readable misses, ambiguous evidence and new official links"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: collegeum-phd-admissions-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: >-
      (
        github.event_name != 'workflow_run' &&
        github.ref == 'refs/heads/main'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.name == 'telegram-sync' &&
        github.event.workflow_run.event == 'schedule' &&
        github.event.workflow_run.conclusion == 'success'
      )
    runs-on: ubuntu-latest
    # A trusted main-branch opt-in can investigate all readable misses.
    # Scheduled and fallback checks keep the original 25-minute cap.
    timeout-minutes: ${{ (
      (github.event_name == 'workflow_dispatch' && inputs.full_recheck == true) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-admissions-recheck]'))
      ) && 180 || 25 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate reference catalogue offline
        run: python3 -S tools/update_phd_admissions.py --check
      - name: Check primary university pages with robots-aware bounded rotation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_RECHECK: ${{
            (github.event_name == 'workflow_dispatch' && inputs.full_recheck == true) ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[full-admissions-recheck]'))
            }}
        run: |
          set -euo pipefail
          args=(--batch-size 25)
          if [[ "$FULL_RECHECK" == "true" ]]; then
            # Full, opt-in review of all *readable* misses. Each institution
            # receives exactly one robots-aware bounded verification pass.
            # Restricted/unavailable URLs are never retried early.
            args=(--batch-size 40 --recheck-all-readable)
          elif [[ "$EVENT_NAME" == "push" ]]; then
            # Ordinary checker upgrades keep the original 25-page recheck.
            args+=(--recheck-no-explicit)
          fi
          python3 -S tools/update_phd_admissions.py "${args[@]}"
      - name: Audit coverage and unresolved sources for every programme
        run: python3 -S tools/audit_phd_admissions.py --json > docs/data/phd_admissions_coverage.json
      - name: Validate independent PhD call source registry offline
        run: python3 -S tools/update_official_calls.py --check
      - name: Check bounded official institutional funding-call pages
        run: python3 -S tools/update_official_calls.py
      - name: Commit only derived public official-source observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/phd_admissions.json docs/data/phd_admissions_coverage.json docs/data/official_phd_calls.json
          if git diff --cached --quiet; then
            echo "No official programme or funding-call observation changes"
            exit 0
          fi
          git commit -m "data: refresh official Economics PhD admissions observations [skip ci]"
          # An in-flight source run can overlap an authoritative source URL
          # repair. A normal git rebase will conflict on the generated JSON.
          # Never use --ours, --theirs or a force push: those may attribute
          # evidence collected on a previous URL to its replacement.
          recover_from_latest_main() {
            # Discard only this *unpublished* snapshot; re-read the actual
            # institution URL from the latest checked-in seed inventory.
            git reset --hard origin/main
            python3 -S tools/update_phd_admissions.py --check
            python3 -S tools/update_phd_admissions.py --batch-size 40 --recheck-all-readable
            python3 -S tools/update_phd_admissions.py --check
            python3 -S tools/update_official_calls.py --check
            python3 -S tools/update_official_calls.py
            git add -- docs/data/phd_admissions.json docs/data/official_phd_calls.json
            if git diff --cached --quiet; then
              echo "Fresh main requires no additional official observations"
              exit 0
            fi
            git commit -m "data: refresh official Economics PhD admissions observations [skip ci]"
          }
          # The deep-review job can run while a trusted main commit arrives.
          # Rebase only when source provenance is still valid, otherwise
          # re-verify on the new authoritative main before any public write.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort
              recover_from_latest_main
            elif ! python3 -S tools/update_phd_admissions.py --check ||
                 ! python3 -S tools/update_official_calls.py --check; then
              recover_from_latest_main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "Main advanced during admissions review; push not applied" >&2
          exit 1
