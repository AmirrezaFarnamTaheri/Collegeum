name: phd-admissions-refresh

# Isolated catalogue reconciliation. This never executes vacancy ingestion,
# subscriber delivery, Telegram, or any provider-policy-blocked job-board scan.
on:
  schedule:
    - cron: "17 3 * * *"
  # Run the first official-source batch immediately when the checker or
  # seed inventory changes on main. Do not trigger on generated catalogue
  # commits, preventing a self-sustaining Actions loop.
  push:
    branches: [main]
    paths:
      - "tools/update_phd_admissions.py"
      - "config/phd_admissions_seeds.json"
      - ".github/workflows/phd-admissions-refresh.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collegeum-phd-admissions-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate reference catalogue offline
        run: python3 -S tools/update_phd_admissions.py --check
      - name: Check primary university pages with robots-aware bounded rotation
        run: python3 -S tools/update_phd_admissions.py --batch-size 25
      - name: Commit only derived public official-source observations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/data/phd_admissions.json
          if git diff --cached --quiet; then
            echo "No programme observation changes"
            exit 0
          fi
          git commit -m "data: refresh official Economics PhD admissions observations [skip ci]"
          git push origin HEAD:main
