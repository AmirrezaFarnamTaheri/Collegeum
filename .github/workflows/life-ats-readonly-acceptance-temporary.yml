name: life-ats-readonly-acceptance-temporary
# Bounded public vacancy identity verification. No secrets or notifications.
on:
  push:
    branches: [investigate/life-recruitment-ats-20261030]
    paths: [.github/workflows/life-ats-readonly-acceptance-temporary.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [life_nordic_linkoping, life_nordic_slu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Check public official vacancy identities and doctoral-title filter
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import asyncio,json,os,re
          from pathlib import Path
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.scrapers.link_scan import LinkScanScraper
          from predoc_pipeline.ingest.http import PoliteClient
          from tools.probe_life_sciences_sources import PROBE_USER_AGENT
          source=next(s for s in load_board_sources("config/life_sciences_sources/nordics.toml")
                      if s.name==os.environ["SOURCE"])
          url=source.opt("url")
          result={"source":source.name,"url":url}
          with PoliteClient(user_agent=PROBE_USER_AGENT,timeout=18,
                            per_host_delay=3,respect_robots=True) as client:
              reply=client.get(url,use_cache=False)
          result["http_status"]=reply.status
          if not reply.ok:
              raise SystemExit("No permitted listing access; got HTTP "+str(reply.status))
          class StubHttp:
              async def get_text(self,request_url):
                  assert request_url==url
                  return reply.text
              def set_host_interval(self,requested_url,delay):
                  assert delay>=0
          posts,meta=asyncio.run(LinkScanScraper(source,StubHttp()).run())
          result["count"]=len(posts)
          result["unique_urls"]=len({p.url for p in posts})
          result["samples"]=[{"title":p.title,"url":p.url} for p in posts[:20]]
          out=Path("build")/(source.name+".json");out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          assert posts and len(posts)==len({p.url for p in posts})
          assert all(re.search(r"^(?:Ph[.]?D[.]?|Doctoral|Doktorand)\b",p.title,re.I)
                     for p in posts)
          assert all("/job?" in p.url and "job_id=" in p.url for p in posts)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: life-reachmee-${{ matrix.source }}-${{ github.run_id }}
          path: build/life_nordic_*.json
          retention-days: 14
          if-no-files-found: warn
