name: build-single-file

# The self-contained materializer is built from reviewed source, never
# checked into Git or pushed to a PR branch by a privileged bot.
on:
  push:
    branches: ['**']
    paths:
      - .github/workflows/*.yml
      - src/**
      - tests/**
      - tools/**
      - config/**
      - review/**
      - docs/*.html
      - '*.md'
      - pyproject.toml
      - uv.lock
      - Makefile
      - .gitignore
      - .gitattributes
      - .env.example
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collegeum-distribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build and verify standalone materializer
        run: |
          python3 tools/build_single_file.py
          python3 -S tools/verify_single_file.py
      - name: Upload standalone distribution
        uses: actions/upload-artifact@v7
        with:
          name: collegeum-single-file-${{ github.sha }}
          path: compile_project.py
          retention-days: 14
          if-no-files-found: error
