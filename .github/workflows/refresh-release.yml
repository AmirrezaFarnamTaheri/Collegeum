name: refresh-release

# Rebuild the checked-in single-file distribution and uv.lock on a working
# branch. Production main is intentionally not mutated by this bot.
# A maintainer may dispatch a refresh on any working branch.
# Recheck all source files after Pages' Node-24-compatible action upgrades. Editing this
# workflow also refreshes it automatically, with no feature-branch hardcoding.
on:
  push:
    branches: ['**']
    paths:
      - .github/workflows/refresh-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collegeum-release-refresh-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  regenerate:
    if: >-
      github.repository == 'AmirrezaFarnamTaheri/Collegeum' &&
      github.ref_type == 'branch' &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Rebuild and push only from current remote branch state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'collegeum-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          # A concurrent writer must not make the regenerated manifest stale.
          # On a push conflict, refetch/recompute rather than pushing an
          # artifact constructed from yesterday's source tree.
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            uv lock
            python tools/build_single_file.py
            python -S tools/verify_single_file.py
            git add -- uv.lock compile_project.py
            if git diff --cached --quiet; then
              echo 'Generated artifacts already current'
              exit 0
            fi
            git commit -m 'chore: synchronize locked dependencies and reproducible distribution [skip ci]'
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Branch advanced during refresh (attempt ${attempt}); retrying."
            sleep 3
          done
          echo 'Could not push refreshed artifacts without overwriting newer changes.'
          exit 1

      - name: Verify committed artifact
        run: python -S tools/verify_single_file.py
