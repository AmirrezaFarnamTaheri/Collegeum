name: audit-life-recruitment-recovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Inspect seven official recruitment pages without publishing
        run: PYTHONPATH=src python3 tools/audit_life_recruitment_recovery.py
