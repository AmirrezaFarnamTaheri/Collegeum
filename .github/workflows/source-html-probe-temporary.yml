name: official-sources-readonly-probe-temporary
on:
  push:
    branches: [fix/zew-niesr-source-recovery-20261028]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Check source markup, discoverable links, and existing parser outcome
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.scrapers.link_scan import LinkScanScraper

          SOURCES = {
            "zew": ["https://www.zew.de/karriere/stellenangebote/","https://www.zew.de/en/career/job-offers"],
            "niesr": ["https://www.niesr.ac.uk/about/vacancies","https://niesr.ac.uk/careers"],
            "academictransfer": ["https://www.academictransfer.com/en/jobs/?q=research+assistant+economics"],
          }
          configs = {s.name: s for s in load_board_sources("config/sources.toml")}
          async def main():
              async with HttpClient(timeout=17, max_retries=0, default_min_interval=0.2) as http:
                  for key, urls in SOURCES.items():
                      for url in urls:
                          print("=== SOURCE",key,url,flush=True)
                          try:
                              resp = await http.request("GET",url)
                              html = resp.text
                              soup = BeautifulSoup(html,"lxml")
                              print("STATUS",resp.status_code,"FINAL",str(resp.url),"BYTES",len(html),
                                "TITLE",soup.title.get_text(" ",strip=True)[:110] if soup.title else "-",
                                "TEXT_HEAD",soup.get_text(" ",strip=True)[:260],flush=True)
                              links=soup.find_all("a",href=True)
                              picked=[]
                              for a in links:
                                  href=str(a.get("href",""))
                                  txt=a.get_text(" ",strip=True)[:100]
                                  if re.search(r"jobposting|karriere/stellen|(?:/vacancy/)|recruit|jobs\.zew|stellenangebote|doc|research|econom|assistant|open positions",href+" "+txt,re.I):
                                      picked.append((txt,href[:185],str(a.parent)[:330]))
                              print("LINKS",len(links),"CANDIDATE",len(picked),flush=True)
                              for entry in picked[:35]:
                                  print("LINK",repr(entry),flush=True)
                              for needle in ["jobposting","jobs.zew.de","Doctoral Researcher","no vacancies","Current vacancies"]:
                                  print("TOKEN",needle,html.lower().count(needle.lower()),flush=True)
                              cfg=configs[key]
                              scraper=LinkScanScraper(cfg,http)
                              posts=scraper.parse_postings([(url,html)])
                              print("PARSE",[(p.title,p.url) for p in posts[:15]],"ERRORS",scraper.discovery_parse_errors,flush=True)
                          except Exception as exc:
                              print("FETCH_ERROR",type(exc).__name__,str(exc)[:230],flush=True)
          asyncio.run(main())
          PY