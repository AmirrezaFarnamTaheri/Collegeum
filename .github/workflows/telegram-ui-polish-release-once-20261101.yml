name: telegram-ui-polish-release-once-20261101

# Execute existing inspect/deploy/sync workflows once on this file's merge.
# Preserve the current Telegram webhook and DO subscriber/delivery state.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/telegram-ui-polish-release-once-20261101.yml

permissions:
  contents: read
  actions: write

concurrency:
  group: telegram-ui-polish-release-once-20261101
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'AmirrezaFarnamTaheri/Collegeum'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Inspect intended account, deploy without webhook reset, then sync
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          test "$current" = "$RELEASE_SHA" || {
            echo 'Main has advanced; refusing a stale Worker release.'; exit 1;
          }

          dispatch_and_wait() {
            local workflow="$1" expected="$2" since run_id
            shift 2
            since="$(date -u -d '10 seconds ago' +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run "$workflow" --ref main "$@"
            run_id=""
            for attempt in $(seq 1 60); do
              run_id="$(EXPECTED="$expected" START="$since" gh run list \
                --workflow "$workflow" --limit 40 \
                --json databaseId,event,createdAt,headSha \
                --jq 'map(select(.event == "workflow_dispatch" and .headSha == env.EXPECTED and .createdAt >= env.START)) | sort_by(.createdAt) | last | .databaseId // empty')"
              if test -n "$run_id"; then break; fi
              sleep 5
            done
            test -n "$run_id" || { echo "Workflow dispatch was not observed: $workflow"; exit 1; }
            echo "Inspect run details: https://github.com/$GH_REPO/actions/runs/$run_id"
            gh run watch "$run_id" --exit-status --interval 15
          }

          echo '1/3: Existing inspect-only Cloudflare and Telegram connection checks'
          dispatch_and_wait telegram-worker.yml "$RELEASE_SHA" \
            -f inspect_only=true -f activate_webhook=false

          current="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          test "$current" = "$RELEASE_SHA" || {
            echo 'Main advanced after inspection; refusing to deploy a different revision.'
            exit 1
          }

          echo '2/3: Existing verified Worker deployment; webhook activation disabled'
          dispatch_and_wait telegram-worker.yml "$RELEASE_SHA" \
            -f inspect_only=false -f activate_webhook=false

          echo '3/3: Existing encrypted subscriber and listing snapshot synchronization'
          current="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          dispatch_and_wait telegram.yml "$current"
          echo 'Worker deployment and sync succeeded; next job verifies the live owner menu.'

  smoke:
    needs: release
    if: github.repository == 'AmirrezaFarnamTaheri/Collegeum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ vars.COLLEGEUM_SECRET_ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify protected Worker state, fresh inventory and one owner menu message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_ENABLED: ${{ vars.TELEGRAM_WEBHOOK_ENABLED || 'false' }}
          TELEGRAM_WORKER_URL: ${{ vars.TELEGRAM_WORKER_URL }}
          TELEGRAM_WORKER_SYNC_TOKEN: ${{ secrets.TELEGRAM_WORKER_SYNC_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          report_file="$(mktemp)"
          trap 'rm -f "$report_file"' EXIT
          python3 -S tools/telegram_connection.py --smoke > "$report_file"
          python3 - "$report_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              report = json.load(fh)
          assert report.get("ready") is True, "Webhook connection not ready"
          assert report.get("webhook_matches_worker") is True, "Wrong live webhook"
          assert report.get("telegram_delivery") == "webhook", "Unexpected delivery mode"
          assert report.get("snapshot_fresh") is True, "Snapshot not fresh"
          assert report.get("last_delivery_error_at") is None, "Recent Telegram delivery error"
          assert report.get("live_test", {}).get("menu_delivery_confirmed") is True, (
              "Owner menu message not acknowledged"
          )
          worker = report.get("worker") or {}
          counts = worker.get("inventory_counts")
          assert isinstance(counts, dict), "Deployed worker does not expose inventory diagnostics"
          assert all(isinstance(counts.get(k), int) and counts[k] >= 0
                     for k in ("academic", "career")), "Invalid worker inventory counts"
          print("Authenticated live Telegram smoke: pass")
          print("Current inventory counts:", counts)
          print("Snapshot timestamp:", worker.get("snapshot_at"))
          print("Owner menu delivery confirmed; no webhook or preference changes")
          PY
