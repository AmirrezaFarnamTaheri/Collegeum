name: official-econ-sources-readonly-acceptance-temporary

on:
  push:
    branches:
      - feat/official-econ-source-expansion-20261029

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked --extra portals
      - name: Collect official source discovery only (no publication, AI, or database)
        shell: bash
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import asyncio
          import json
          from pathlib import Path
          from predoc_pipeline.boards.collector import _scrape_all
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers import SCRAPERS
          from predoc_pipeline.core.health import public_failure, source_status

          NAMES = {
              "yale_egc_jobs",
              "wharton_predoc",
          }

          async def main():
              configs = [
                  cfg for cfg in load_board_sources(Path("config/sources.toml"))
                  if cfg.name in NAMES
              ]
              assert {c.name for c in configs} == NAMES
              async with HttpClient(timeout=18, max_retries=0, default_min_interval=0.15) as http:
                  results = await _scrape_all(
                      [SCRAPERS[cfg.type](cfg, http) for cfg in configs],
                      5,
                      130,
                  )
              failures = []
              for result in results:
                  stats = result.as_stats()
                  status = source_status(stats)
                  snippet = [
                      {"title": p.title[:115], "url": p.url[:260]}
                      for p in result.posts[:7]
                  ]
                  record = {
                      "name": result.scraper.name,
                      "status": status,
                      "ok": result.ok,
                      "items": stats.get("items"),
                      "raw": stats.get("raw"),
                      "fetched": stats.get("fetched"),
                      "errors": stats.get("errors"),
                      "stage": stats.get("failure_stage"),
                      "messages": [public_failure(m) for m in (stats.get("messages") or [])],
                      "candidate_samples": snippet,
                  }
                  print("OFFICIAL_SOURCE", json.dumps(record, ensure_ascii=True), flush=True)
                  if status not in {"successful", "empty"}:
                      failures.append(result.scraper.name)
              if failures:
                  raise SystemExit("Official source discovery needs repair: " + ", ".join(failures))

          asyncio.run(main())
          PY
