name: ifo-public-markup-probe-temporary
on:
  push:
    branches: [fix/ifo-source-coverage-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect public vacancies markup only (not posting data)
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers.link_scan import LinkScanScraper
          from predoc_pipeline.boards.config import load_board_sources

          URLS = [
            "https://www.ifo.de/karriere-am-ifo",
            "https://www.ifo.de/en/career-ifo",
            "https://www.ifo.de/en/your-career-in-research",
            "https://econjobmarket.org/positions?position_type_id=6",
          ]

          async def main():
              async with HttpClient(timeout=18,max_retries=0,default_min_interval=0.3) as client:
                  for url in URLS:
                      print("=== SOURCE", url, flush=True)
                      try:
                          html=await client.get_text(url)
                          soup=BeautifulSoup(html, "lxml")
                          print("BYTES",len(html),"TITLE",soup.title.get_text(" ",strip=True) if soup.title else "-",flush=True)
                          links=soup.find_all("a",href=True)
                          for a in links:
                              href=a.get("href","")
                              txt=a.get_text(" ",strip=True)[:80]
                              if re.search(r"stellenangebot|job-offer|positions/|postdoctor|/job/",href+" "+txt,re.I):
                                  print("LINK",repr(txt),repr(href[:220]),"PARENT",a.parent.get_text(" ",strip=True)[:150],flush=True)
                          print("LINKCOUNT",len(links),flush=True)
                          for t in soup.find_all(string=re.compile("Postdoctoral Researcher.*International Economics",re.I))[:4]:
                              p=t.parent
                              print("MATCH",p.name,repr(p.get_text(" ",strip=True)[:250]),flush=True)
                              for n in [p,p.parent,p.parent.parent,p.parent.parent.parent]:
                                  print("ANCESTOR",n.name,repr(n.get("class",[])),repr(str(n)[:1800]),flush=True)
                          if "ifo.de" in url:
                              cfg=next(x for x in load_board_sources("config/sources.toml") if x.name=="ifo")
                              parser=LinkScanScraper(cfg,client)
                              posts=parser.parse_postings([(url,html)])
                              print("PARSER",[(p.title,p.url) for p in posts[:12]], "parse_errors",parser.discovery_parse_errors,flush=True)
                      except Exception as exc:
                          print("FETCH_ERROR",type(exc).__name__,str(exc)[:200],flush=True)
          asyncio.run(main())
          PY