name: zew-public-source-probe-temporary
on:
  push:
    branches: [fix/zew-source-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect ZEW official page link structure and existing parser result
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from predoc_pipeline.boards.http import HttpClient

          async def main():
              async with HttpClient(timeout=22,max_retries=0,default_min_interval=0.2) as http:
                  for name in ["api-v5.js","api-v5.min.js"]:
                      url="https://static.b-ite.com/jobs-api/v5/"+name
                      try:
                          js=await http.get_text(url)
                          print("FILE",url,"BYTES",len(js),flush=True)
                          urls=list(dict.fromkeys(re.findall(r'https?://[a-zA-Z0-9._:/-]+',js)))
                          print("URLS",urls[:60],flush=True)
                          for token in ["createClient", "fetch(", "/jobposting", "getJobPostings", "JobPostings", "apiServer", "api/v5", "jobportal", "api.b-ite", "fetchJobPostings", "searchConfig", "postings/search", "JSON.stringify", "XMLHttpRequest", "graphql"]:
                              matches=list(re.finditer(re.escape(token),js,re.I))
                              print("MATCH",token,"N",len(matches),flush=True)
                              for m in matches[:3]:
                                  print("EXCERPT",token,repr(js[max(0,m.start()-180):m.end()+260]),flush=True)
                      except Exception as exc:
                          print("FAIL",name,type(exc).__name__,str(exc)[:250],flush=True)
          asyncio.run(main())
          PY
