name: zew-public-source-probe-temporary
on:
  push:
    branches: [fix/zew-source-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect ZEW official page link structure and existing parser result
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from predoc_pipeline.boards.http import HttpClient

          async def main():
              async with HttpClient(timeout=20,max_retries=0,default_min_interval=0.2) as http:
                  s=await http.get_text("https://static.b-ite.com/jobs-api/v5/api-v5.js")
                  for term in ["postingSearchUrl", "apiKey", "this.key", "client.config.key", "Client = function", "Client.prototype", "prototype.search", "searchPostings", "function Client", "new HttpClient", "requestPostings", "post(config", "this.http.post", "key: this.config.key", "this.config.postingSearchUrl"]:
                      hits=list(re.finditer(re.escape(term),s,re.I))
                      print("TERM",term,"COUNT",len(hits),flush=True)
                      for m in hits[:5]:
                          print("EXCERPT",term,"OFFSET",m.start(),repr(s[max(0,m.start()-500):m.end()+900]),flush=True)
          asyncio.run(main())
          PY
