name: zew-public-source-probe-temporary
on:
  push:
    branches: [fix/zew-source-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect ZEW official page link structure and existing parser result
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.http import HttpClient

          async def main():
              async with HttpClient(timeout=22,max_retries=0,default_min_interval=0.2) as http:
                  page=await http.get_text("https://www.zew.de/karriere/stellenangebote")
                  soup=BeautifulSoup(page,"lxml")
                  print("LISTING_CATEGORIES",[t.get("data-bite-jobs-api-listing") for t in soup.select("[data-bite-jobs-api-listing]")],flush=True)
                  for name in ["mitarbeiter.min.js","mitarbeiter.js"]:
                      endpoint="https://cs-assets.b-ite.com/zew/jobs-api/"+name
                      try:
                          code=await http.get_text(endpoint)
                          print("SOURCE",endpoint,"BYTES",len(code),"PREFIX",repr(code[:2600]),flush=True)
                          print("SUFFIX",repr(code[-2300:]),flush=True)
                          allurls=list(dict.fromkeys(re.findall(r'https?://[a-zA-Z0-9._/-]+',code)))
                          print("URLS",allurls[:40],flush=True)
                          for token in ["jobposting","api/v5","api/v1","jobportal","filters","openings","jobOffer","Postdoctoral","b-ite.com","jobs.zew.de","document.write","fetch("]:
                              matches=list(re.finditer(re.escape(token),code,re.I))
                              print("TOKEN",token,"N",len(matches),flush=True)
                              for m in matches[:2]:
                                  print("EXCERPT",token,repr(code[max(0,m.start()-130):m.end()+210]),flush=True)
                      except Exception as e:
                          print("FETCH_ERROR",name,type(e).__name__,str(e)[:250],flush=True)
          asyncio.run(main())
          PY
