name: zew-public-source-probe-temporary
on:
  push:
    branches: [fix/zew-source-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Reproduce ZEW job API regression (focused RED)
        env:
          PYTHONPATH: src
        run: uv run pytest -q tests/boards/test_bite_jobs.py

      - name: Verify official ZEW B-ite adapter (read-only; no persistence or sending)
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          import asyncio
          from predoc_pipeline.boards.collector import _scrape_all
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers import SCRAPERS

          async def main():
              source=next(x for x in load_board_sources("config/sources.toml") if x.name=="zew")
              async with HttpClient(timeout=22,max_retries=0,default_min_interval=0.5) as http:
                  result=(await _scrape_all([SCRAPERS[source.type](source,http)],1,40))[0]
                  print("LIVE_ZEW_HEALTH",result.as_stats(),flush=True)
                  print("LIVE_ZEW_POSITIONS",[(p.title,p.url,str(p.deadline)) for p in result.posts],flush=True)
                  assert result.ok, "ZEW endpoint degraded; inspect source-level error"
                  assert len(result.posts)>=4, "ZEW jobs still missing despite current official adverts"
                  assert any("Postdoctoral" in p.title for p in result.posts)
          asyncio.run(main())
          PY
