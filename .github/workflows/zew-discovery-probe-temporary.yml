name: zew-public-source-probe-temporary
on:
  push:
    branches: [fix/zew-source-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect ZEW official page link structure and existing parser result
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from predoc_pipeline.boards.http import HttpClient

          async def main():
              async with HttpClient(timeout=20,max_retries=0,default_min_interval=0.2) as http:
                  js=await http.get_text("https://static.b-ite.com/jobs-api/v5/api-v5.js")
                  for token in ["Client.prototype.prepareRequestConfig = ", "function createDefaultSearchConfig()", "function validateSearchConfig(config)", "Client.prototype.getUrl = "]:
                      at=js.find(token)
                      print("SYMBOL",token,"INDEX",at,flush=True)
                      if at>=0:
                          print("CODE",repr(js[at:at+2100]),flush=True)
          asyncio.run(main())
          PY
