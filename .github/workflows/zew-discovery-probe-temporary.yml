name: zew-public-source-probe-temporary
on:
  push:
    branches: [fix/zew-source-discovery-20261028]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect ZEW official page link structure and existing parser result
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.http import HttpClient

          async def main():
              async with HttpClient(timeout=22,max_retries=0,default_min_interval=0.2) as http:
                  page=await http.get_text("https://www.zew.de/karriere/stellenangebote")
                  soup=BeautifulSoup(page,"lxml")
                  for tag in soup.find_all(True):
                      classes=" ".join(tag.get("class") or [])
                      attrs=" ".join(tag.attrs)
                      if any(s in (classes+" "+attrs).lower() for s in ["bite", "b-ite", "job-widget", "job-api"]):
                          tagname=tag.name
                          keys=list(tag.attrs)
                          safe_attrs={k:v for k,v in tag.attrs.items() if k in {"id","class","src","type","data-app-id","data-api-url","data-company-id","data-job-language"}}
                          print("WIDGET",tagname,keys,repr(safe_attrs)[:350],flush=True)
                  for token in ["jobs-api","api-loader-v1","bite-job","jobposting","b-ite.com","job-list"]:
                      ix=page.find(token)
                      if ix>=0:
                          print("MARKER",token,"CONTEXT",repr(page[max(0,ix-110):ix+190]),flush=True)
                  script_url="https://static.b-ite.com/jobs-api/loader-v1/api-loader-v1.min.js"
                  try:
                      script=await http.get_text(script_url)
                      print("LOADER_BYTES",len(script),flush=True)
                      urls=list(dict.fromkeys(re.findall(r'https?://[a-zA-Z0-9._/-]+',script)))
                      print("LOADER_URLS",urls[:25],flush=True)
                      for token in ["/jobs", "/jobposting", "companyId", "api/v1", "baseUrl", "joboffers", "api/v2", "/list"]:
                          matches=list(re.finditer(re.escape(token),script,re.I))
                          print("JS_MARKER",token,"COUNT",len(matches),flush=True)
                          for m in matches[:2]:
                              print("JS_CONTEXT",token,repr(script[max(0,m.start()-150):m.end()+170]),flush=True)
                  except Exception as e:
                      print("SCRIPT_ERROR",type(e).__name__,str(e)[:200],flush=True)
          asyncio.run(main())
          PY
