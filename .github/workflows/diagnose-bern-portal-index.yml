name: diagnose-bern-portal-index
on:
  push:
    branches:
      - diagnostics/bern-portal-live-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked
      - name: Robots-aware read-only inspection of official career indexes
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee bern-index-probe.json
          import json
          import re
          from urllib.parse import urljoin, urlsplit
          from bs4 import BeautifulSoup
          from predoc_pipeline.ingest.http import PoliteClient

          pages = {
              "official_career": "https://karriere.unibe.ch/offene_stellen/index_ger.html",
              "employer_job_portal": "https://jobs.unibe.ch/",
              "prospective_job_portal": "https://unibe.prospective.ch/",
              "prospective_en": "https://unibe.prospective.ch/?lang=en",
          }
          report = {}
          with PoliteClient(
              user_agent="Collegeum-BernSourceProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=15, per_host_delay=3, respect_robots=True,
          ) as http:
              for name, url in pages.items():
                  response = http.get(url, use_cache=False)
                  item = {
                      "status": response.status,
                      "ok": response.ok,
                      "error": str(response.error)[:120],
                      "bytes": len(response.content),
                  }
                  if response.ok:
                      soup = BeautifulSoup(response.text, "lxml")
                      item["scripts"] = [
                          urljoin(url, src)[:240] for tag in soup.select("script[src]")
                          if (src := tag.get("src"))
                      ][:20]
                      item["iframes"] = [
                          urljoin(url, src)[:240] for tag in soup.select("iframe[src]")
                          if (src := tag.get("src"))
                      ][:10]
                      item["matching_links"] = [
                          {
                              "href": urljoin(url, str(tag.get("href", "")))[:240],
                              "title": tag.get_text(" ", strip=True)[:120],
                          }
                          for tag in soup.select("a[href]")
                          if re.search(r"job-vacancies/|offene-stellen/|public/v1/jobs/|/jobs/\d+",
                                       str(tag.get("href", "")), re.I)
                      ][:25]
                      item["text_start"] = soup.get_text(" ", strip=True)[:150]
                      item["has_react_root"] = bool(soup.select("#root, #app"))
                  report[name] = item
          print(json.dumps(report, indent=2))
          PY
      - name: Inspect publicly shipped Prospective API hints (no credentials)
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee bern-api-hints.json
          import json
          import re
          from bs4 import BeautifulSoup
          from predoc_pipeline.ingest.http import PoliteClient

          locations = {
              "public_client_bundle": "https://unibe.prospective.ch/careercenter/1001892/static/index-CtgvSgPP.js",
              "official_iframe": "https://ohws.prospective.ch/public/v2/careercenter/1001892/?lang=de",
          }
          report = {}
          with PoliteClient(
              user_agent="Collegeum-BernSourceProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=16, per_host_delay=3, respect_robots=True,
          ) as client:
              for name, address in locations.items():
                  result = client.get(address, use_cache=False)
                  data = {"ok": result.ok, "status": result.status,
                          "error": str(result.error)[:120],
                          "bytes": len(result.content)}
                  if result.ok:
                      body = result.text
                      urls = re.findall(r'https?://[a-zA-Z0-9._-]+(?:/[a-zA-Z0-9/_-]{0,100})?', body)
                      data["related_hosts_paths"] = sorted(set(
                          x for x in urls if any(k in x.lower() for k in
                          ("prospective", "jobs", "api", "careercenter"))
                      ))[:30]
                      data["context_samples"] = [
                          body[max(0, m.start()-45):m.start()+90]
                          for m in re.finditer(
                              r'(?i)(?:graphql|/api/|/public/v\d/|/careercenter/|joblist|fetchjobs|vacancy)',
                              body,
                          )
                      ][:16]
                      data["script_paths"] = [
                          str(tag.get("src", ""))[:160] for tag in
                          BeautifulSoup(body, "lxml").select("script[src]")
                      ][:10]
                  report[name] = data
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Inspect public Prospective career medium feed safely
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee bern-medium-probe.json
          import json
          from predoc_pipeline.ingest.http import PoliteClient

          urls = {
              "medium": "https://ohws.prospective.ch/public/v1/medium/1001892",
              "legacy_job_center": "https://ohws.prospective.ch/public/v2/careercenter/1001892/?lang=en",
          }
          report = {}
          with PoliteClient(
              user_agent="Collegeum-BernSourceProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=15, per_host_delay=3, respect_robots=True,
          ) as http:
              for name, url in urls.items():
                  result = http.get(url, use_cache=False)
                  entry = {"status": result.status, "ok": result.ok,
                           "error": str(result.error)[:160],
                           "bytes": len(result.content)}
                  if result.ok:
                      try:
                          body = json.loads(result.text)
                          entry["payload_type"] = type(body).__name__
                          if isinstance(body, dict):
                              entry["keys"] = list(body)[:35]
                              entry["field_types"] = {
                                  k: type(v).__name__ for k, v in list(body.items())[:20]
                              }
                              for k, v in list(body.items()):
                                  if isinstance(v, list):
                                      entry["array_" + k] = {"length": len(v),
                                          "first_keys": list(v[0])[:15] if v and
                                          isinstance(v[0], dict) else []}
                          if isinstance(body, list):
                              entry["count"] = len(body)
                              entry["first_keys"] = list(body[0])[:25] if body and isinstance(body[0], dict) else []
                      except (ValueError, TypeError):
                          entry["text_start"] = result.text[:180]
                  report[name] = entry
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Inspect published JavaScript request construction (read-only)
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee bern-bundle-calls.json
          import json
          import re
          from predoc_pipeline.ingest.http import PoliteClient

          url = "https://unibe.prospective.ch/careercenter/1001892/static/index-CtgvSgPP.js"
          with PoliteClient(
              user_agent="Collegeum-BernSourceProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=18, per_host_delay=3, respect_robots=True,
          ) as http:
              response = http.get(url, use_cache=False)
              result = {"status": response.status, "ok": response.ok}
              if response.ok:
                  body = response.text
                  samples = {}
                  patterns = {
                      "base_url": r"baseUrl",
                      "medium_path": r"/medium/",
                      "job_list": r"JobList|jobList",
                      "job_path": r"/jobs",
                      "search": r"searchParams|searchJobs|jobSearch",
                      "axios": r"axios|\.get\(|\.post\(",
                      "job_api": r"jobsPageS|jobAboSubscriptionFormUrl",
                  }
                  for key, pattern in patterns.items():
                      found = []
                      for match in re.finditer(pattern, body):
                          snippet = body[max(0, match.start()-95):match.end()+130]
                          if snippet not in found:
                              found.append(snippet[:225])
                          if len(found) >= 7:
                              break
                      samples[key] = found
                  result["contexts"] = samples
              print(json.dumps(result, ensure_ascii=False, indent=2))
          PY
      - name: Probe actual public Prospective job endpoint discovered from shipped client
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee bern-job-feed-probe.json
          import json
          from predoc_pipeline.ingest.http import PoliteClient

          url = "https://ohws.prospective.ch/public/v1/medium/1001892/jobs?offset=0&limit=12&lang=en"
          with PoliteClient(
              user_agent="Collegeum-BernSourceProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=18, per_host_delay=3, respect_robots=True,
          ) as http:
              response = http.get(url, use_cache=False)
              data = {"status": response.status, "ok": response.ok,
                      "error": str(response.error)[:130], "bytes": len(response.content)}
              if response.ok:
                  try:
                      payload = json.loads(response.text)
                      data["payload_type"] = type(payload).__name__
                      data["top_keys"] = list(payload)[:35] if isinstance(payload, dict) else []
                      data["arrays"] = {
                          k: {"length": len(v), "first_keys": list(v[0])[:22]
                              if v and isinstance(v[0], dict) else []}
                          for k, v in payload.items() if isinstance(v, list)
                      } if isinstance(payload, dict) else {}
                      if isinstance(payload, list):
                          data["array_count"] = len(payload)
                          data["first_keys"] = list(payload[0])[:28] if payload and isinstance(payload[0], dict) else []
                      if isinstance(payload, dict):
                          data["scalars"] = {
                              k: v for k, v in payload.items()
                              if isinstance(v, (int, float, bool)) or v is None
                          }
                  except (ValueError, TypeError):
                      data["text_start"] = response.text[:220]
              print(json.dumps(data, indent=2))
          PY
      - name: Inspect job identity and employer URL contract (no publishing)
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee bern-job-schema.json
          import json
          from predoc_pipeline.ingest.http import PoliteClient

          endpoint = "https://ohws.prospective.ch/public/v1/medium/1001892/jobs"
          report = {}
          with PoliteClient(
              user_agent="Collegeum-BernSourceProbe/1.0 (+https://github.com/AmirrezaFarnamTaheri/Collegeum)",
              timeout=18, per_host_delay=3, respect_robots=True,
          ) as http:
              for offset in (0, 12):
                  response = http.get(f"{endpoint}?offset={offset}&limit=12&lang=en",
                                      use_cache=False)
                  item = {"status": response.status, "ok": response.ok,
                          "error": str(response.error)[:140]}
                  if response.ok:
                      body = json.loads(response.text)
                      jobs = body.get("jobs", [])
                      item["offset"] = body.get("offset")
                      item["total"] = body.get("total")
                      item["count"] = len(jobs)
                      item["examples"] = [
                          {"id": job.get("id"), "hk_id": job.get("hk_id"),
                           "viewkey": job.get("viewkey"),
                           "title": str(job.get("title"))[:120],
                           "attributes": job.get("attributes"),
                           "szas": job.get("szas"),
                           "links": job.get("links"),
                           "start_date": job.get("start_date"),
                           "end_date": job.get("end_date"),
                           "language": job.get("language")}
                          for job in jobs[:4] if isinstance(job, dict)
                      ]
                      item["special_titles"] = [
                          {"id":job.get("id"),"title":str(job.get("title"))[:120],
                           "links":job.get("links")}
                          for job in jobs if isinstance(job, dict)
                          and any(x in str(job.get("title")).lower() for x in (
                              "phd","doctoral","doktorand","doktorat","promotio",
                          ))
                      ][:10]
                  report[str(offset)] = item
          print(json.dumps(report, ensure_ascii=False, indent=2, default=str))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bern-portal-index-probe
          path: |
            bern-index-probe.json
            bern-api-hints.json
            bern-medium-probe.json
            bern-bundle-calls.json
            bern-job-feed-probe.json
            bern-job-schema.json
          retention-days: 14
