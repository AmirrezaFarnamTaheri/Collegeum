name: workday-source-shape-probe-temporary
on:
  push:
    branches: [fix/workday-source-integrity-20261028]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Diagnose public Workday search shapes and parsing without publishing
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import asyncio
          from collections import Counter
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.scrapers.university_ats import WorkdayScraper,parse_workday_url
          from predoc_pipeline.boards.collector import _scrape_all
          NAMES = ("ubc","mcgill","uchicago_bfi")
          configs = {s.name:s for s in load_board_sources("config/sources.toml")}
          async def main():
              async with HttpClient(timeout=16,max_retries=0,default_min_interval=0.5) as http:
                  for name in NAMES:
                      source=configs[name]
                      scraper=WorkdayScraper(source,http)
                      host,tenant,site,_=parse_workday_url(source.opt("url"))
                      api=f"https://{host}/wday/cxs/{tenant}/{site}/jobs"
                      print("=== WORKDAY",name,"TERMS",len(source.opt("search_terms")),"MAXPAGES",source.opt("max_pages",3),flush=True)
                      for term in source.opt("search_terms"):
                          try:
                              data=await http.post_json(api,{"appliedFacets":{},"limit":20,"offset":0,"searchText":term})
                              if not isinstance(data,dict):
                                  print("SHAPE",term,"nonobject",type(data).__name__,flush=True)
                                  continue
                              batch=data.get("jobPostings")
                              if not isinstance(batch,list):
                                  print("SHAPE",term,"jobPostings",type(batch).__name__,"keys",sorted(data),flush=True)
                                  continue
                              p_err0=len(scraper.discovery_parse_errors)
                              posts=scraper.parse_postings(batch)
                              reasons=scraper.discovery_parse_errors[p_err0:]
                              anomalies=Counter()
                              for row in batch:
                                  if not isinstance(row,dict): anomalies["not_dict"]+=1; continue
                                  for key in ("title","externalPath","bulletFields","locationsText","postedOn"):
                                      value=row.get(key)
                                      if key in ("title","externalPath") and (not isinstance(value,str) or not value): anomalies[key+"_missing_or_nonstr"]+=1
                                      if key=="bulletFields" and value is not None and (not isinstance(value,list) or any(not isinstance(v,str) for v in value)): anomalies[key+"_unexpected_"+type(value).__name__]+=1
                                      if key in ("locationsText","postedOn") and value is not None and not isinstance(value,str): anomalies[key+"_unexpected_"+type(value).__name__]+=1
                              print("PAGE",name,repr(term),"total",data.get("total"),"count",len(batch),"parsed",len(posts),"parse_errors",dict(Counter(reasons)),"anomalies",dict(anomalies),flush=True)
                          except Exception as exc:
                              print("FETCH",name,repr(term),type(exc).__name__,str(exc)[:130],flush=True)
                      report=(await _scrape_all([WorkdayScraper(source,http)],1,150))[0]
                      stats=report.as_stats()
                      print("FULL",name,"items",len(report.posts),"ok",report.ok,
                            "failure_stage",stats["failure_stage"],
                            "failure_counts",stats["failure_counts"],"error",report.error,flush=True)
                      print("END",name,flush=True)
          asyncio.run(main())
          PY