name: verify-life-sciences-output-branch

# The stored journal is public repository data; no private subscription state.
# No live discovery and no Telegram or publication credentials.
on:
  push:
    branches:
      - feat/100-source-guarded-expansion-20261029
    paths:
      - .github/workflows/verify-life-sciences-output-branch.yml
      - tools/export_life_sciences.py
      - src/predoc_pipeline/ingest/life_sciences.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journal-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Export stored Life Sciences journal without network discovery
        run: uv run --no-sync python tools/export_life_sciences.py --output build/life-sciences-positions.csv
      - name: Validate saved output grain and country completeness
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path
          from urllib.parse import urlsplit

          path = Path("build/life-sciences-positions.csv")
          with path.open(encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))
          urls = [row["application_url"] for row in rows]
          report = {
              "rows": len(rows),
              "unique_urls": len(set(urls)),
              "with_country": sum(bool(row["country"]) for row in rows),
              "without_country": sum(not row["country"] for row in rows),
              "funding_status": dict(Counter(row["funding_status"] for row in rows)),
              "non_doctoral_title_examples": [
                  row["title"] for row in rows
                  if not any(x in row["title"].lower() for x in (
                      "phd", "ph.d", "doctoral", "doctorand", "doktor", "predoc",
                  ))
              ][:10],
          }
          print(json.dumps(report, indent=2, ensure_ascii=False))
          Path("build/life-sciences-output-audit.json").write_text(
              json.dumps(report, indent=2, ensure_ascii=False) + "\n", encoding="utf-8",
          )
          if not rows or len(urls) != len(set(urls)):
              raise SystemExit("Invalid or duplicate Life Sciences export identity")
          if not all(urlsplit(url).scheme == "https" and urlsplit(url).hostname
                     for url in urls):
              raise SystemExit("Invalid Life Sciences application URL")
          if report["without_country"]:
              raise SystemExit("Stored Life Sciences export has unresolved countries")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: life-sciences-journal-output-${{ github.run_id }}
          path: |
            build/life-sciences-positions.csv
            build/life-sciences-positions.json
            build/life-sciences-output-audit.json
          retention-days: 14
          if-no-files-found: warn
