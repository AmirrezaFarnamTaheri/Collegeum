name: CREST official alternate route verification (temporary)
on:
  push:
    branches: [probe/crest-official-alternate-20261029]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Probe university-owned CREST mirrors without publication
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.scrapers.link_scan import LinkScanScraper

          URLS=[
              "https://crest.science/opportunities-2/",
              "https://new.crest.science/opportunities-2/?tab=onglet3",
              "https://new.crest.science/opportunities-2/",
          ]
          async def main():
              cfg=next(x for x in load_board_sources("config/sources.toml") if x.name=="crest_jobs")
              async with HttpClient(timeout=12,max_retries=0,default_min_interval=0.2) as http:
                  for url in URLS:
                      print("SOURCE",url,flush=True)
                      try:
                          html=await http.get_text(url)
                          soup=BeautifulSoup(html,"lxml")
                          jobs=soup.select('#onglet3 a[href$=".pdf"]')
                          print("BYTES",len(html),"PAGE_TITLE",soup.title.get_text(" ",strip=True) if soup.title else "-","PDF_ANCHORS",len(jobs),flush=True)
                          for a in jobs[:12]:
                              print("PDF",repr(a.get_text(" ",strip=True)[:120]),repr(a.get("href","")[:180]),flush=True)
                          parser=LinkScanScraper(cfg.model_copy(update={"url":url}),http)
                          posts=parser.parse_postings([(url,html)])
                          print("PARSED_COUNT",len(posts),"ERRORS",parser.discovery_parse_errors,flush=True)
                          for p in posts[:10]:
                              print("POSTING",repr(p.title[:130]),repr(p.url[:190]),flush=True)
                      except Exception as exc:
                          print("FETCH_ERROR",type(exc).__name__,str(exc)[:170],flush=True)
          asyncio.run(main())
          PY
