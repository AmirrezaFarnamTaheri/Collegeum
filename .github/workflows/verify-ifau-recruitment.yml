name: verify-ifau-recruitment
on:
  push:
    branches: [feat/recover-ifau-economics-source-20261030]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Live official IFAU vacancy evidence
        run: PYTHONPATH=src python3 tools/verify_ifau_live.py
