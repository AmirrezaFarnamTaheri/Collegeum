name: Official source routes read-only probe (temporary)
on:
  push:
    branches: [verify/official-source-routes-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Inspect current ECB cards, pages and genuine job IDs (GET only)
        env:
          PYTHONPATH: src
        run: |
          python3 - <<'PY'
          import asyncio
          import re
          from urllib.parse import urlsplit
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.http import HttpClient
          from predoc_pipeline.boards.config import load_board_sources
          from predoc_pipeline.boards.scrapers.link_scan import LinkScanScraper

          HOST="https://talent.ecb.europa.eu"
          URLS=[
            HOST+"/careers",
            HOST+"/careers/SearchJobs",
            HOST+"/careers/JobDetail/PhD-Traineeship-in-the-Directorate-General-Economics-Supply-Side-Labour-and-Surveillance-Division/15381",
          ]
          async def main():
              cfg=next(x for x in load_board_sources("config/sources.toml") if x.name=="ecb")
              cfg=cfg.model_copy(update={
                "url":HOST+"/careers/SearchJobs",
                "link_pattern":r"^https://talent\\.ecb\\.europa\\.eu/careers/JobDetail/[^/?#]+/\\d+$"
              })
              async with HttpClient(timeout=14,max_retries=0,default_min_interval=0.2) as http:
                  for url in URLS:
                      try:
                          html=await http.get_text(url)
                          soup=BeautifulSoup(html,"lxml")
                          links=soup.select("a[href*='/JobDetail/']")
                          unique=list(dict.fromkeys(x["href"] for x in links))
                          print("PAGE",url,"BYTES",len(html),"TITLE",soup.title.get_text(" ",strip=True) if soup.title else None,"JOB_LINKS",len(links),"UNIQUE",len(unique),flush=True)
                          print("SNIPPET",repr(soup.get_text(" ",strip=True)[:900]),flush=True)
                          for a in links[:16]:
                              print("JOBLINK",repr(a.get_text(" ",strip=True)[:145]),repr(a["href"][:230]),flush=True)
                              node=a.parent
                              for i in range(3):
                                  if node:
                                      print("CARD",i,node.name,node.get("class",[])[:8] if isinstance(node.get("class"),list) else node.get("class"),repr(node.get_text(" ",strip=True)[:420]),flush=True)
                                      node=node.parent
                          for a in soup.find_all("a",href=True):
                              s=a.get_text(" ",strip=True)
                              h=a["href"]
                              if re.search("next|more|pagination|page|filter|search",s+" "+h,re.I) and len(s)<70:
                                  print("NAV",repr(s),repr(h[:140]),flush=True)
                          result=LinkScanScraper(cfg,http).parse_postings([(url,html)])
                          print("PARSED",len(result),[(x.title,x.url) for x in result[:12]],flush=True)
                      except Exception as exc:
                          print("ERROR",url,type(exc).__name__,str(exc)[:250],flush=True)
          asyncio.run(main())
          PY
