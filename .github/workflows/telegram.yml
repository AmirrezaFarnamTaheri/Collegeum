name: telegram-sync

# Answers /positions, /applied, /valid, /hidden, /help and saves the
# interested / not-for-me / applied button taps to the encrypted data/feedback.enc.
#
# There is no always-on server: this checks for new messages every 30 minutes
# from 03:15 to 20:45 UTC (06:45-00:15 in Tehran), so a reply can take up to
# half an hour. Telegram keeps unread messages for 24 hours, so nothing is lost
# overnight. The 04:xx slots are omitted by this schedule. Pipeline runs also
# answer messages, and the two jobs share one queue. About 34 short runs a day
# (~1,000 of the 2,000 free minutes a month on a private repository); widen
# the interval below to use fewer.
on:
  schedule:
    - cron: "15,45 3,5-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predoc-bot
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref: the branch, not the commit that triggered the run. A run that
      # waited in the queue behind the other workflow must start from the
      # newest data, not from the state before that run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
          enable-cache: true

      - name: Install locked bot dependencies
        run: |
          uv lock --check
          uv sync --locked

      - name: Answer messages and save button taps
        id: sync
        # Partial cursor/feedback updates must survive if the API fails later.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FEEDBACK_ENCRYPTION_KEY: ${{ secrets.FEEDBACK_ENCRYPTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          # Marks are personal and this repository may be public: refuse to run
          # (and so to commit) without the key that encrypts them.
          if [ -z "$FEEDBACK_ENCRYPTION_KEY" ]; then
            echo "Set the FEEDBACK_ENCRYPTION_KEY secret (python -m predoc_pipeline.cli feedback-key)."
            exit 1
          fi
          PYTHONPATH=src python3 -m predoc_pipeline.cli telegram-sync

      - name: Save marks and cursor
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        run: |
          git config user.name "predoc-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in data/feedback.enc data/telegram_state.json docs/data/listings.json \
                   docs/feed.xml; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "nothing new"
            exit 0
          fi
          git commit -m "chore: save Telegram marks [skip ci]"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "could not push the marks"
          exit 1

      - name: Fail job if Telegram processing failed
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          if [ "$SYNC_OUTCOME" != "success" ]; then
            echo "Telegram sync failed; inspect the processing step and saved state."
            exit 1
          fi
