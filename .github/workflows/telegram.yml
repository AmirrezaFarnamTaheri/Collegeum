name: telegram-sync

# Answers /positions, /applied, /valid, /hidden, /help and saves the
# interested / not-for-me / applied button taps to the encrypted data/feedback.enc.
#
# There is no always-on server: this checks for new messages every 30 minutes
# throughout the day, including overnight (subject to GitHub cron delays).
# Telegram only retains unconsumed updates for at most 24 hours, so prolonged
# runner outages can still lose updates. Source and inbox jobs are serialized.
on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predoc-bot
  cancel-in-progress: false
  queue: max

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref: the branch, not the commit that triggered the run. A run that
      # waited in the queue behind the other workflow must start from the
      # newest data, not from the state before that run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Check private state repository is private
        if: ${{ vars.PRIVATE_STATE_REPO != '' }}
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_STATE_TOKEN }}
          PRIVATE_STATE_REPO: ${{ vars.PRIVATE_STATE_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PRIVATE_STATE_TOKEN is required for PRIVATE_STATE_REPO"
            exit 1
          fi
          if [ "$(gh api "repos/$PRIVATE_STATE_REPO" --jq '.private')" != "true" ]; then
            echo "::error::Refusing to store subscriber state in a public repository"
            exit 1
          fi

      - name: Checkout authoritative private state
        if: ${{ vars.PRIVATE_STATE_REPO != '' }}
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.PRIVATE_STATE_REPO }}
          token: ${{ secrets.PRIVATE_STATE_TOKEN }}
          path: .private-state
          fetch-depth: 1

      - name: Restore authoritative private state
        if: ${{ vars.PRIVATE_STATE_REPO != '' }}
        run: python tools/private_state.py restore

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          activate-environment: true
          enable-cache: true

      - name: Install locked bot dependencies
        run: |
          uv lock --check
          uv sync --locked

      - name: Process private commands and reserve notification intents
        id: sync
        # The runner cannot send private alerts until the encrypted intent
        # checkpoint has been pushed to the repository in the next step.
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_PUBLIC_CHANNEL_ID: ${{ secrets.TELEGRAM_PUBLIC_CHANNEL_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          FEEDBACK_ENCRYPTION_KEY: ${{ secrets.FEEDBACK_ENCRYPTION_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -e
          if [ -z "$FEEDBACK_ENCRYPTION_KEY" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Encrypted storage or Telegram token not configured; bot disabled."
            echo "private_enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "private_enabled=true" >> "$GITHUB_OUTPUT"
          PYTHONPATH=src python3 -m predoc_pipeline.cli telegram-sync
          PYTHONPATH=src python3 -m predoc_pipeline.cli subscriber-plan

      - name: Commit input cursor and untransmitted private intents
        id: checkpoint
        if: ${{ always() && steps.sync.outcome != 'skipped' }}
        env:
          PRIVATE_STATE_REPO: ${{ vars.PRIVATE_STATE_REPO }}
        run: |
          set -euo pipefail
          git config user.name "predoc-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in docs/data/listings.json docs/feed.xml; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if [ -z "$PRIVATE_STATE_REPO" ]; then
            for f in data/feedback.enc data/telegram_state.json; do
              if [ -e "$f" ]; then git add "$f"; fi
            done
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: checkpoint Telegram inbox and private intents [skip ci]"
            if ! (git pull --rebase --autostash && git push); then
              git rebase --abort 2>/dev/null || true
              echo "::error::Public exports could not be persisted; refusing to send"
              exit 1
            fi
          fi
          if [ -n "$PRIVATE_STATE_REPO" ]; then
            python tools/private_state.py checkpoint
          fi

      - name: Send only the checkpointed private alert batch
        id: delivery
        if: >-
          steps.sync.outcome == 'success' &&
          steps.sync.outputs.private_enabled == 'true' &&
          steps.checkpoint.outcome == 'success'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FEEDBACK_ENCRYPTION_KEY: ${{ secrets.FEEDBACK_ENCRYPTION_KEY }}
        run: |
          PYTHONPATH=src python3 -m predoc_pipeline.cli subscriber-send

      - name: Commit acknowledgements and reconciliation state
        id: acknowledgement
        if: ${{ always() && steps.delivery.outcome != 'skipped' }}
        env:
          PRIVATE_STATE_REPO: ${{ vars.PRIVATE_STATE_REPO }}
        run: |
          set -euo pipefail
          if [ -n "$PRIVATE_STATE_REPO" ]; then
            python tools/private_state.py checkpoint
          else
            git config user.name "predoc-pipeline-bot"
            git config user.email "actions@users.noreply.github.com"
            if [ -e data/feedback.enc ]; then git add data/feedback.enc; fi
            if ! git diff --cached --quiet; then
              git commit -m "chore: record private delivery acknowledgements [skip ci]"
              if ! (git pull --rebase --autostash && git push); then
                git rebase --abort 2>/dev/null || true
                echo "::error::Cannot commit acknowledgement without conflicts"
                exit 1
              fi
            fi
          fi

      - name: Fail if inbox, persistence, or private delivery failed
        if: always()
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          CHECKPOINT_OUTCOME: ${{ steps.checkpoint.outcome }}
          DELIVERY_OUTCOME: ${{ steps.delivery.outcome }}
          ACK_OUTCOME: ${{ steps.acknowledgement.outcome }}
        run: |
          if [ "$SYNC_OUTCOME" != "success" ] ||
             [ "$CHECKPOINT_OUTCOME" != "success" ] ||
             [ "$DELIVERY_OUTCOME" = "failure" ] ||
             [ "$ACK_OUTCOME" = "failure" ]; then
            echo "Telegram processing or checkpoint failed; inspect steps and state."
            exit 1
          fi
