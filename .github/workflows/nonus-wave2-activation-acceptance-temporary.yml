name: nonus-wave2-activation-acceptance-temporary
# One-time read-only check of exactly two official European career sources.
on:
  push:
    branches: [feat/nonus-wave2-evidence-20261030]
    paths: [.github/workflows/nonus-wave2-activation-acceptance-temporary.yml]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        name: [wifo_austria_jobs, ceps_brussels_research]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Read-only official vacancy acceptance (no publication)
        env:
          SOURCE_NAME: ${{ matrix.name }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import asyncio,json,os
          from pathlib import Path
          from predoc_pipeline.boards.config import load_board_sources,HttpConfig
          from predoc_pipeline.boards.collector import _scrape_all,build_http
          from predoc_pipeline.boards.scrapers import SCRAPERS
          from tools.probe_source_expansion import robots_allow_source
          name=os.environ["SOURCE_NAME"]
          cfg={s.name:s for s in load_board_sources("config/sources.toml")}[name]
          assert cfg.enabled and cfg.opt("title_allow_pattern") and not cfg.field_implied
          report={"source":name,"status":"unverified"}
          async def run():
              if not await asyncio.to_thread(robots_allow_source,cfg):
                  report["status"]="blocked_by_robots_or_unknown"
                  return
              opts=HttpConfig(timeout=12,max_retries=0,max_concurrent_sources=1,
                              default_min_interval=2.0,source_timeout=110)
              async with build_http(opts) as http:
                  result=(await _scrape_all([SCRAPERS[cfg.type](cfg,http)],1,110))[0]
              report.update(status="reviewable" if result.ok else "adapter_error",
                            count=len(result.posts),
                            distinct_urls=len({p.url for p in result.posts}),
                            errors=result.as_stats()["failure_counts"],
                            failure_stage=result.failure_stage,
                            examples=[{"title":p.title,"url":p.url} for p in result.posts[:8]])
          asyncio.run(run())
          path=Path("build")/(name+".json");path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if report["status"]!="reviewable" or report.get("count",0)==0:
              raise SystemExit("Source not accepted by live parser")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nonus-wave2-acceptance-${{ matrix.name }}-${{ github.run_id }}
          path: build/*.json
          retention-days: 14
          if-no-files-found: warn
