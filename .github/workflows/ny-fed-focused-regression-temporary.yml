name: ny-fed-focused-regression-temporary

on:
  push:
    branches:
      - fix/ny-fed-unrelated-speech-false-positive-20261029

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev --extra portals
      - name: NY Fed seasonal-source regression
        run: PYTHONPATH=src python3 -m pytest tests/boards/test_ny_fed_seasonal_source.py -q
