name: life-ats-source-shape-temporary
# Read-only, public, robots-aware source verification.
on:
  push:
    branches: [investigate/life-recruitment-ats-20261030]
    paths: [.github/workflows/life-ats-source-shape-temporary.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        site: [linkoping_reachmee, slu_reachmee, bern_prospective]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Observe official ATS anchors under robots policy
        env:
          SITE: ${{ matrix.site }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          from urllib.parse import urljoin,urlsplit
          from bs4 import BeautifulSoup
          from predoc_pipeline.ingest.http import PoliteClient
          from tools.probe_life_sciences_sources import PROBE_USER_AGENT
          sites = {
            "linkoping_reachmee":"https://web103.reachmee.com/ext/I011/853/main?lang=UK&site=7&validator=d7a66c13be778ef950c393a904293789",
            "slu_reachmee":"https://web103.reachmee.com/ext/I017/1114/main?lang=UK&site=7&validator=87e4b706891e51f731ed44be28da8352",
            "bern_prospective":"https://ohws.prospective.ch/public/v2/careercenter/1001892/?lang=en",
          }
          name=os.environ["SITE"];url=sites[name]
          report={"name":name,"url":url}
          with PoliteClient(user_agent=PROBE_USER_AGENT,timeout=17,
                            per_host_delay=3,respect_robots=True) as client:
              try:
                  response=client.get(url,use_cache=False)
                  report.update(http_status=response.status,ok=response.ok)
                  if response.ok:
                      soup=BeautifulSoup(response.text[:750000],"lxml")
                      links=[]
                      for a in soup.select("a[href]"):
                          href=urljoin(url,str(a.get("href") or ""))
                          label=a.get_text(" ",strip=True)
                          if urlsplit(href).scheme!="https": continue
                          if re.search(r"phd|doctoral|doktor|research|medicine|genom|"
                                       r"biolog|job|vacanc|rmpage|rmjob",href+" "+label,re.I):
                              links.append({"title":label[:120],"url":href})
                      report.update(html_chars=len(response.text),
                          anchors=len(soup.select("a[href]")),
                          relevant_anchor_count=len(links),relevant_anchors=links[:25],
                          iframe_sources=[urljoin(url,str(e.get("src"))) for e in soup.select("iframe[src]")][:8],
                          script_count=len(soup.select("script[src]")),
                          has_job_schema=bool(soup.select('script[type="application/ld+json"]')))
              except Exception as exc:
                  report["status"]="fetch_exception"
                  report["error_type"]=type(exc).__name__
          print(json.dumps(report,indent=2,ensure_ascii=False))
          out=Path("build")/("ats-"+name+".json");out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ats-evidence-${{ matrix.site }}-${{ github.run_id }}
          path: build/ats-*.json
          retention-days: 14
          if-no-files-found: warn
