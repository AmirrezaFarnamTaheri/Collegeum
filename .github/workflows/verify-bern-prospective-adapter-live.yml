name: verify-bern-prospective-adapter-live

# Read-only; no public/private journal writes or Telegram credentials.
on:
  push:
    branches:
      - diagnostics/bern-adapter-live-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/life-bern-prospective-api-20261031
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          activate-environment: true
      - run: uv sync --locked
      - name: Verify real Bern scraper end-to-end without publication
        run: |
          PYTHONPATH=src python3 - <<'PY' | tee bern-adapter-live.json
          import asyncio
          import json
          import subprocess
          from urllib.parse import urlsplit
          from predoc_pipeline.boards.config import HttpConfig
          from predoc_pipeline.ingest.life_sciences import classify_post, discover

          health = {}
          posts, errors = asyncio.run(discover(
              "config/life_sciences.toml",
              HttpConfig(timeout=15, max_retries=0, source_timeout=90,
                         default_min_interval=1.5),
              selected_names={"life_dach_bern"}, diagnostics=health,
          ))
          source = health.get("life_dach_bern", {})
          accepted = [x for p in posts if (x := classify_post(p))]
          summary = {
              "head": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True,
              ).strip(),
              "index_status": source.get("status"),
              "vacancy_links": source.get("vacancy_links"),
              "doctoral_candidates": source.get("doctoral_candidates"),
              "eligible_doctoral_jobs": len(accepted),
              "detail_failures": source.get("detail_failures"),
              "discovery_issues": source.get("discovery_issues"),
              "errors": errors[:8],
              "sample_eligible": [
                  {"title": x["title"], "url": x["url"],
                   "deadline": x.get("deadline"), "country": x["country"]}
                  for x in accepted[:15]
              ],
              "unique_post_urls": len({p.url for p in posts}),
              "parsed_post_count": len(posts),
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          assert source.get("status") == "discovered", summary
          assert source.get("vacancy_links", 0) >= 50, summary
          assert source.get("doctoral_candidates", 0) >= 1, summary
          assert len(accepted) >= 1, summary
          assert not errors and not source.get("detail_failures"), summary
          assert len({p.url for p in posts}) == len(posts), summary
          assert all(urlsplit(p.url).hostname == "jobs.unibe.ch" for p in posts)
          assert all(x.get("deadline") and x["country"] == "Switzerland"
                     for x in accepted)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bern-prospective-live
          path: bern-adapter-live.json
          if-no-files-found: warn
          retention-days: 14
