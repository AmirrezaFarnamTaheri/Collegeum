name: source-public-probe-temporary
on:
  push:
    branches: [fix/remaining-official-sources-20261029]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
      - run: uv sync --locked --extra dev
      - name: Focused regression RED before source fixes
        env:
          PYTHONPATH: src
        run: uv run pytest -q tests/boards/test_live_official_source_states.py
      - name: Inspect official public source markup and existing parser behavior
        env:
          PYTHONPATH: src
        run: |
          uv run python - <<'PY'
          import asyncio
          import re
          from bs4 import BeautifulSoup
          from predoc_pipeline.boards.http import HttpClient

          PAGES=[
              ("ny_fed_index","https://www.newyorkfed.org/research/careers/research_analysts/index"),
              ("ny_fed_alt","https://www.newyorkfed.org/research/careers/research_analysts/index.html"),
              ("iies_stockholm","https://www.su.se/english/divisions/institute-for-international-economic-studies/about-the-institute/work-with-us"),
              ("opportunity_insights","https://opportunityinsights.org/joinourteam/"),
          ]
          TERMS={
              "ny_fed_index":["Research Analyst", "Summer 2027", "We apologize", "errors/500"],
              "ny_fed_alt":["Research Analyst", "Summer 2027", "We apologize", "errors/500"],
              "iies_stockholm":["At the IIES", "junior faculty", "Econ Job Market", "Available jobs"],
              "opportunity_insights":["Associate Data Scientist", "Thank you for your interest", "open positions", "Keep an eye on our openings"],
          }

          async def main():
              async with HttpClient(timeout=20,max_retries=0,default_min_interval=0.3) as http:
                  for name,url in PAGES:
                      try:
                          resp=await http.request("GET",url)
                          soup=BeautifulSoup(resp.text,"lxml")
                          body=" ".join(soup.stripped_strings)
                          print("SOURCE",name,"STATUS",resp.status_code,"FINAL",str(resp.url),"BYTES",len(resp.text),"TITLE",soup.title.get_text(" ",strip=True) if soup.title else "-",flush=True)
                          print("BODY_PREFIX",name,repr(body[:800]),flush=True)
                          for term in TERMS[name]:
                              match=re.search(re.escape(term),body,re.I)
                              print("MATCH",name,repr(term),"FOUND",bool(match),"CONTEXT",repr(body[max(0,match.start()-140):match.end()+260]) if match else "-",flush=True)
                          if name=="opportunity_insights":
                              print("ALL_HIRING_PDFS",[(a.get_text(" ",strip=True)[:90],a.get("href","")[:200]) for a in soup.select('a[href$=".pdf"]') if "wp-content/uploads" in a.get("href","")],flush=True)
                      except Exception as e:
                          print("FETCH_ERROR",name,type(e).__name__,str(e)[:260],flush=True)
          asyncio.run(main())
          PY