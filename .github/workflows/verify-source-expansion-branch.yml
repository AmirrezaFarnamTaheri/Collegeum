name: verify-100-source-expansion-branch

# Read-only probes on a candidate branch. No private state, Telegram, or publish.
on:
  push:
    branches:
      - feat/100-source-guarded-expansion-20261029
    paths:
      - config/source_expansion_20261029.csv
      - config/non_us_sources_20261029.csv
      - config/sources.toml
      - tools/probe_source_expansion.py
      - .github/workflows/verify-source-expansion-branch.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-100-expansion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - cohort: initial
            manifest: config/source_expansion_20261029.csv
            offset: 0
          - cohort: initial
            manifest: config/source_expansion_20261029.csv
            offset: 10
          - cohort: initial
            manifest: config/source_expansion_20261029.csv
            offset: 20
          - cohort: non-us
            manifest: config/non_us_sources_20261029.csv
            offset: 0
          - cohort: non-us
            manifest: config/non_us_sources_20261029.csv
            offset: 10
          - cohort: non-us
            manifest: config/non_us_sources_20261029.csv
            offset: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - name: Install locked read-only probe dependencies
        run: uv sync --locked
      - name: Probe only the selected candidates
        env:
          MANIFEST: ${{ matrix.manifest }}
          OFFSET: ${{ matrix.offset }}
          COHORT: ${{ matrix.cohort }}
        run: |
          PYTHONPATH=src python3 tools/probe_source_expansion.py \
            --manifest "$MANIFEST" --offset "$OFFSET" --limit 10 \
            --output "build/source-probe-$COHORT-$OFFSET.json"
      - name: Preserve candidate evidence even for failed jobs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-probe-${{ matrix.cohort }}-${{ matrix.offset }}-${{ github.run_id }}
          path: build/source-probe-*.json
          retention-days: 14
          if-no-files-found: warn
