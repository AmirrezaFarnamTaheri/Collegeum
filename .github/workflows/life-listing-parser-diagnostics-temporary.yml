name: life-listing-parser-diagnostics-temporary
# One-time public, read-only, robots-aware source-shape inspection.
# No credentials, subscriber state, or notification endpoints.
on:
  push:
    branches: [fix/life-source-probe-coverage-20261030]
    paths: [.github/workflows/life-listing-parser-diagnostics-temporary.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [life_nordic_linkoping, life_nordic_slu, life_dach_bern, life_ibec_barcelona, life_academictransfer_epigenomics]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Observe official page link structure without bypassing robots
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit
          from bs4 import BeautifulSoup
          from predoc_pipeline.ingest.http import PoliteClient
          from predoc_pipeline.ingest.life_sciences import load_life_sources
          from tools.probe_life_sciences_sources import candidate_links, PROBE_USER_AGENT
          name = os.environ["SOURCE"]
          sources = {s.name: s for s in load_life_sources("config/life_sciences.toml")}
          source = sources[name]
          urls = source.opt("urls") or [source.opt("url")]
          url = urls[0]
          report = {"source": name, "checked_url": url}
          with PoliteClient(user_agent=PROBE_USER_AGENT, timeout=15,
                            per_host_delay=3, respect_robots=True) as client:
              reply = client.get(url, use_cache=False)
          report["http_status"] = reply.status
          if reply.ok:
              soup = BeautifulSoup(reply.text[:650000], "lxml")
              anchors = soup.select("a[href]")
              pattern = source.opt("link_pattern", "^$")
              report["html_chars"] = len(reply.text)
              report["anchors"] = len(anchors)
              report["current_pattern_matches"] = candidate_links(reply.text, url, pattern)
              report["possible_job_links"] = [
                  {"label": a.get_text(" ",strip=True)[:80], "url": urljoin(url, str(a.get("href")))}
                  for a in anchors
                  if re.search(r"phd|doctor|predoc|vacanc|jobs?/|academic|prospective", 
                               (a.get_text(" ",strip=True)+" "+str(a.get("href"))),re.I)
              ][:12]
              report["iframes"] = [urljoin(url,str(f.get("src"))) for f in soup.select("iframe[src]")][:8]
              report["script_reference_counts"] = {
                  "job_detail_link": len(re.findall(r"/vacancies/\\d+|/job-vacancies/|/jobs-and-vacancies/doktorand",reply.text,re.I)),
                  "json_script_tags": len(soup.select('script[type="application/json"]')),
              }
          else:
              report["status"] = "blocked_by_robots" if reply.status == 999 else "fetch_error"
          print(json.dumps(report,indent=2,ensure_ascii=False))
          path = Path("build") / ("life-diagnostic-" + name + ".json")
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: life-listing-${{ matrix.source }}-${{ github.run_id }}
          path: build/life-diagnostic-*.json
          retention-days: 14
          if-no-files-found: warn
