name: copenhagen-official-readonly-probe-temporary

on:
  push:
    branches:
      - investigate/copenhagen-runner-source-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe canonical UCPH sources and report bounded network diagnostics (no writes)
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import re
          import time
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser

          # All targets are official university pages; no commercial mirrors,
          # credentials, unsafe redirect workarounds, or mutation.
          URLS = [
              "https://employment.ku.dk/all-vacancies/",
              "https://jobportal.ku.dk/alle-opslag/",
              "https://www.economics.ku.dk/jobs/",
              "https://www.ku.dk/english/",
              "https://www.economics.ku.dk/",
          ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href:
                          self.hrefs.append(href)

          def probe(url):
              start = time.monotonic()
              request = urllib.request.Request(
                  url, headers={"User-Agent": "Collegeum-source-health-check/1.0", "Accept": "text/html"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=12) as response:
                      final = response.geturl()
                      status = response.status
                      payload = response.read(1500000)
                  text = payload.decode("utf-8", errors="replace")
                  parser = Links()
                  parser.feed(text)
                  candidates = [
                      u for u in parser.hrefs
                      if re.search(r"(all-vacancies|alle-opslag|show=|jobID|jobid)", u, re.I)
                  ]
                  print(f"PROBE {url} status={status} final={final} bytes={len(payload)} "
                        f"links={len(parser.hrefs)} vacancy_candidates={len(candidates)} "
                        f"economics_empty={'no current vacancies' in text.lower()} "
                        f"elapsed={time.monotonic() - start:.1f}s", flush=True)
                  for href in candidates[:6]:
                      print(f"CANDIDATE {url} {href[:220]}", flush=True)
              except urllib.error.HTTPError as exc:
                  print(f"PROBE {url} status={exc.code} reason=http_error "
                        f"elapsed={time.monotonic() - start:.1f}s", flush=True)
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  cause = getattr(exc, "reason", exc)
                  print(f"PROBE {url} failure={type(exc).__name__} "
                        f"cause_type={type(cause).__name__} errno={getattr(cause,'errno',None)} "
                        f"cause={str(cause)[:120]} "
                        f"elapsed={time.monotonic() - start:.1f}s", flush=True)

          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as executor:
              list(executor.map(probe, URLS))
          PY
