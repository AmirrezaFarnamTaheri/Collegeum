name: copenhagen-official-readonly-probe-temporary

on:
  push:
    branches:
      - investigate/copenhagen-runner-source-20261029
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe official University of Copenhagen vacancy pages (no writes)
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import time
          import urllib.error
          import urllib.request
          from html.parser import HTMLParser

          URLS = [
              "https://employment.ku.dk/all-vacancies/",
              "https://jobportal.ku.dk/alle-ledige-stillinger/",
          ]

          class Links(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag == "a":
                      href = dict(attrs).get("href", "")
                      if href:
                          self.hrefs.append(href)

          for url in URLS:
              t0 = time.monotonic()
              request = urllib.request.Request(
                  url, headers={"User-Agent": "Collegeum-source-health-check/1.0", "Accept": "text/html"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=18) as response:
                      final = response.geturl()
                      status = response.status
                      payload = response.read(1500000)
                  parser = Links()
                  parser.feed(payload.decode("utf-8", errors="replace"))
                  vacancy_hrefs = [
                      u for u in parser.hrefs
                      if re.search(r"(all-vacancies|alle-ledige-stillinger|show=|jobID|jobid)", u, re.I)
                  ]
                  print(f"PROBE {url} status={status} final={final} bytes={len(payload)} "
                        f"links={len(parser.hrefs)} vacancy_candidates={len(vacancy_hrefs)} "
                        f"elapsed={time.monotonic() - t0:.1f}s", flush=True)
                  for href in vacancy_hrefs[:8]:
                      print("CANDIDATE", href[:220])
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  print(f"PROBE {url} failed={type(exc).__name__} "
                        f"elapsed={time.monotonic() - t0:.1f}s", flush=True)
          PY
