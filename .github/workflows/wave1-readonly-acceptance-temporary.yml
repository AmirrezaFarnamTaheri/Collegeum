name: wave1-readonly-acceptance-temporary

# Branch-only evidence check. Remove before merging the PR.
on:
  push:
    branches: [feat/verified-econ-wave1-20261029]
    paths: [.github/workflows/wave1-readonly-acceptance-temporary.yml, config/sources.toml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source:
          - tamu_public_policy
          - brandeis_business_econ
          - urban_institute_policy
          - federal_reserve_system_jobs
          - nus_policy_research
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Check official ATS vacancy identity, scope and robots policy
        env:
          SOURCE_NAME: ${{ matrix.source }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import asyncio
          import json
          import os
          from pathlib import Path

          from predoc_pipeline.boards.collector import _scrape_all, build_http
          from predoc_pipeline.boards.config import HttpConfig, load_board_sources
          from predoc_pipeline.boards.scrapers import SCRAPERS
          from tools.probe_source_expansion import robots_allow_source

          name = os.environ["SOURCE_NAME"]
          config = {s.name: s for s in load_board_sources("config/sources.toml")}[name]
          assert config.enabled and not config.field_implied
          assert config.opt("title_allow_pattern")
          report = {"name": name, "enabled": True, "status": "unverified"}
          async def run():
              if not await asyncio.to_thread(robots_allow_source, config):
                  report["status"] = "blocked_by_robots_or_unknown"
                  return
              cfg = HttpConfig(timeout=12, max_retries=0, max_concurrent_sources=1,
                               default_min_interval=2.0, source_timeout=110)
              async with build_http(cfg) as http:
                  result = (await _scrape_all(
                      [SCRAPERS[config.type](config, http)], 1, 110
                  ))[0]
              report.update(
                  status="reviewable" if result.ok else "adapter_error",
                  count=len(result.posts),
                  unique_urls=len({p.url for p in result.posts}),
                  failure_stage=result.failure_stage,
                  failure_counts=result.as_stats()["failure_counts"],
                  samples=[{"title": p.title, "url": p.url} for p in result.posts[:8]],
              )
          asyncio.run(run())
          path = Path("build/wave1-" + name + ".json")
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(report, indent=2, ensure_ascii=False))
          print(json.dumps(report, indent=2, ensure_ascii=False))
          if report["status"] != "reviewable" or report.get("count", 0) == 0:
              raise SystemExit("Source not yet verified after activation")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wave1-${{ matrix.source }}-${{ github.run_id }}
          path: build/wave1-*.json
          if-no-files-found: warn
          retention-days: 14
