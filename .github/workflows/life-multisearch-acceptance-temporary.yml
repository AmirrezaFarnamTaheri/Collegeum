name: life-multisearch-acceptance-temporary

# One-time robots-aware, read-only verification across all configured query URLs.
on:
  push:
    branches: [fix/life-source-probe-coverage-20261030]
    paths: [.github/workflows/life-multisearch-acceptance-temporary.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        name: [life_academictransfer_epigenomics, life_euraxess_gene_regulation]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          activate-environment: true
          enable-cache: true
      - run: uv sync --locked
      - name: Verify all four configured query pages without opening job details
        env:
          SOURCE_NAME: ${{ matrix.name }}
        run: |
          PYTHONPATH=src python3 - <<'PY'
          import json,os
          from pathlib import Path
          from predoc_pipeline.ingest.http import PoliteClient
          from predoc_pipeline.ingest.life_sciences import load_life_sources
          import tools.probe_life_sciences_sources as mod
          name=os.environ["SOURCE_NAME"]
          original={s.name:s for s in load_life_sources("config/life_sciences.toml")}
          source=original[name]
          assert source.enabled is True
          mod.load_life_sources=lambda _: [source]
          with PoliteClient(user_agent=mod.PROBE_USER_AGENT,timeout=15,
                            per_host_delay=3,respect_robots=True) as client:
              report=mod.check_sources(client,"config/life_sciences.toml",limit=1)
          item=report["sources"][name]
          assert item["urls_total"]==4 and item["urls_checked"]==4
          print(json.dumps(report,indent=2,ensure_ascii=False))
          path=Path("build")/(name+"-four-url.json");path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(report,indent=2,ensure_ascii=False)+"\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: life-multisearch-${{ matrix.name }}-${{ github.run_id }}
          path: build/*-four-url.json
          retention-days: 14
          if-no-files-found: warn
